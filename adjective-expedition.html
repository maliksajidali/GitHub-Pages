<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Adjective Expedition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sand:#FDEDF0; --sand-dark:#FBDAE1;
    --deep:#5B1A33; --plum:#9C2C55;
    --pink:#E8567A; --pink-light:#F3A0B6;
    --sun:#FFC857; --sun-dark:#F0A93B;
    --coral:#D64545; --white:#FFFFFF;
    --shadow: 0 6px 0 rgba(91,26,51,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Nunito', sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(232,86,122,0.22), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(255,200,87,0.25), transparent 45%),
      var(--sand);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:20px; color:var(--deep); overflow-x:hidden;
  }
  .app{width:100%; max-width:560px;}
  .header{text-align:center; margin-bottom:16px;}
  .title{font-family:'Fredoka', sans-serif; font-weight:700; font-size:clamp(24px,6.6vw,34px); margin:0;}
  .title span{color:var(--pink);}
  .subtitle{font-size:13px; font-weight:700; color:var(--plum); opacity:0.8; text-transform:uppercase; letter-spacing:1.5px; margin-top:4px;}
  .card{background:var(--white); border-radius:26px; padding:24px; border:3px solid var(--deep); box-shadow:var(--shadow); min-height:380px; display:flex; flex-direction:column;}
  .map-grid{display:flex; flex-direction:column; gap:10px;}
  .mission-row{display:flex; align-items:center; gap:14px; background:var(--sand); border:3px solid var(--deep); border-radius:18px; padding:12px 14px; cursor:pointer;}
  .mission-row.locked{opacity:0.55; cursor:not-allowed;}
  .mission-row:not(.locked):active{transform:scale(0.98);}
  .mission-num{font-family:'Fredoka',sans-serif; font-weight:700; font-size:18px; width:40px; height:40px; border-radius:50%; background:var(--pink); color:white; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .mission-row.locked .mission-num{background:#B0B0B0;}
  .mission-row.done .mission-num{background:var(--sun-dark);}
  .mission-info{flex:1;}
  .mission-title{font-family:'Fredoka',sans-serif; font-weight:600; font-size:15px;}
  .mission-diff{font-size:11px; font-weight:700; color:var(--plum); opacity:0.75; text-transform:uppercase;}
  .mission-badge{font-size:26px;}
  .stars-row{font-size:13px; margin-top:2px;}
  .stop-label{font-family:'Fredoka',sans-serif; font-size:12px; font-weight:600; color:white; background:var(--plum); display:inline-block; padding:5px 14px; border-radius:20px; align-self:flex-start; margin-bottom:14px;}
  .progress-dots{display:flex; gap:5px; margin-bottom:16px; flex-wrap:wrap;}
  .dot{width:10px; height:10px; border-radius:50%; background:var(--sand-dark); border:2px solid var(--deep);}
  .dot.filled{background:var(--pink);}
  .dot.wrong{background:var(--coral);}
  .word-emoji{font-size:44px; text-align:center; margin-bottom:6px;}
  .question{font-family:'Fredoka',sans-serif; font-size:clamp(17px,4.6vw,21px); font-weight:600; text-align:center; margin:6px 0 22px 0; line-height:1.4;}
  .blank{color:var(--coral); font-weight:700;}
  .options{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:auto;}
  .opt{font-family:'Nunito',sans-serif; font-weight:800; font-size:15px; padding:14px 8px; border-radius:16px; border:3px solid var(--deep); background:var(--sand); color:var(--deep); cursor:pointer; box-shadow:0 4px 0 var(--deep); transition:transform 0.08s, box-shadow 0.08s, background 0.2s; word-break:break-word;}
  .opt:active{transform:translateY(3px); box-shadow:0 1px 0 var(--deep);}
  .opt:disabled{cursor:default;}
  .opt.correct{background:var(--pink); color:white; animation:pop 0.35s ease;}
  .opt.wrong{background:var(--coral); color:white; animation:shake 0.35s ease;}
  .opt.dim{opacity:0.45;}
  @keyframes pop{0%{transform:scale(1);} 40%{transform:scale(1.08);} 100%{transform:scale(1);}}
  @keyframes shake{0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);}}
  .feedback{text-align:center; font-family:'Fredoka',sans-serif; font-weight:600; font-size:14px; height:22px; margin-top:14px; color:var(--plum);}
  .end{text-align:center; padding:14px 0; margin:auto;}
  .end-emoji{font-size:64px; margin-bottom:10px;}
  .end-title{font-family:'Fredoka',sans-serif; font-size:24px; font-weight:700; margin:0 0 6px 0;}
  .end-sub{font-size:14px; color:var(--plum); margin-bottom:18px; font-weight:700;}
  .stars-big{font-size:30px; margin-bottom:14px;}
  .btn-primary{font-family:'Fredoka',sans-serif; font-weight:600; font-size:16px; background:var(--sun); color:var(--deep); border:3px solid var(--deep); padding:13px 26px; border-radius:18px; cursor:pointer; box-shadow:0 5px 0 var(--sun-dark); margin:4px;}
  .btn-primary:active{transform:translateY(4px); box-shadow:0 1px 0 var(--sun-dark);}
  .btn-secondary{font-family:'Fredoka',sans-serif; font-weight:600; font-size:15px; background:var(--white); color:var(--deep); border:3px solid var(--deep); padding:12px 22px; border-radius:18px; cursor:pointer; margin:4px;}
  .badge-shelf{display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:14px 0;}
  .badge-shelf span{font-size:22px;}
  .confetti{position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:hidden; z-index:50;}
  .confetti span{position:absolute; top:-20px; font-size:20px; animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg); opacity:0.9;}}
  footer{text-align:center; margin-top:14px; font-size:12px; color:var(--plum); opacity:0.65; font-weight:700;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:0.001s !important; transition-duration:0.001s !important;}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1 class="title">Adjective <span>Expedition</span> 🎒</h1>
    <div class="subtitle">10 missions &middot; describe, compare, amaze</div>
  </div>
  <div class="card" id="gameCard"></div>
  <footer>Pick the word that describes it best 🌈</footer>
</div>

<script>
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function pickRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

/* ---- Missions 1-3: basic descriptive (hand-authored) ---- */
const descBank1 = [
  {e:'🧊', s:'The ice is very ___.', correct:'cold', opts:['cold','hot','soft','loud']},
  {e:'🦁', s:"The lion's roar is very ___.", correct:'loud', opts:['loud','quiet','small','sweet']},
  {e:'🐢', s:'The turtle moves very ___.', correct:'slow', opts:['slow','fast','tall','bright']},
  {e:'🐆', s:'The cheetah runs very ___.', correct:'fast', opts:['fast','slow','weak','wet']},
  {e:'🏜️', s:'The desert is very ___.', correct:'dry', opts:['dry','wet','cold','dark']},
  {e:'🌌', s:'The night sky is very ___.', correct:'dark', opts:['dark','bright','warm','loud']},
  {e:'🍬', s:'The candy tastes very ___.', correct:'sweet', opts:['sweet','sour','bitter','salty']},
  {e:'🍋', s:'The lemon tastes very ___.', correct:'sour', opts:['sour','sweet','spicy','bland']},
  {e:'🪨', s:'The rock is very ___.', correct:'hard', opts:['hard','soft','light','wet']},
  {e:'🛏️', s:'The pillow is very ___.', correct:'soft', opts:['soft','hard','sharp','loud']}
];
const descBank2 = [
  {e:'🗿', s:'The giant statue is very ___.', correct:'tall', opts:['tall','short','thin','round']},
  {e:'🐜', s:'The ant is very ___.', correct:'small', opts:['small','huge','loud','soft']},
  {e:'🔥', s:'The fire is very ___.', correct:'hot', opts:['hot','cold','wet','dull']},
  {e:'🤡', s:'The clown makes children ___.', correct:'happy', opts:['happy','sad','angry','bored']},
  {e:'👻', s:'The haunted house feels ___.', correct:'scary', opts:['scary','funny','boring','warm']},
  {e:'😢', s:'After losing the game, he felt ___.', correct:'sad', opts:['sad','happy','proud','calm']},
  {e:'🦁', s:'The lion looked ___ before it roared.', correct:'angry', opts:['angry','calm','sleepy','shy']},
  {e:'🐱', s:'The kitten is very ___.', correct:'cute', opts:['cute','ugly','scary','huge']},
  {e:'🐶', s:'The puppy is ___ and playful.', correct:'friendly', opts:['friendly','mean','lazy','angry']},
  {e:'⚔️', s:'The knight was very ___ in battle.', correct:'brave', opts:['brave','scared','lazy','weak']}
];
const descBank3 = [
  {e:'🌧️', s:'It is raining, so the ground is ___.', correct:'wet', opts:['wet','dry','hot','rough']},
  {e:'📜', s:'The sandpaper feels ___.', correct:'rough', opts:['rough','smooth','soft','wet']},
  {e:'🧣', s:'The silk scarf feels ___.', correct:'smooth', opts:['smooth','rough','sticky','sharp']},
  {e:'🍯', s:'Honey is very ___.', correct:'sticky', opts:['sticky','dry','cold','loud']},
  {e:'🏔️', s:'The mountain peak is covered in ___ snow.', correct:'white', opts:['white','black','green','blue']},
  {e:'🌱', s:'The grass in spring looks ___.', correct:'green', opts:['green','brown','gray','purple']},
  {e:'🏖️', s:'The sun makes the beach sand ___.', correct:'hot', opts:['hot','cold','wet','dark']},
  {e:'🧶', s:'The blanket in winter feels ___.', correct:'warm', opts:['warm','cold','sharp','sour']},
  {e:'🍞', s:'The old bread became ___.', correct:'hard', opts:['hard','soft','sweet','juicy']},
  {e:'💎', s:'The gem sparkled and looked ___.', correct:'shiny', opts:['shiny','dull','dark','plain']}
];

/* ---- Missions 4-8: comparative/superlative (generative) ---- */
const adjBank = {
  tall:{comp:'taller', sup:'tallest'}, small:{comp:'smaller', sup:'smallest'}, big:{comp:'bigger', sup:'biggest'},
  fast:{comp:'faster', sup:'fastest'}, strong:{comp:'stronger', sup:'strongest'}, cold:{comp:'colder', sup:'coldest'},
  loud:{comp:'louder', sup:'loudest'}, bright:{comp:'brighter', sup:'brightest'}, quick:{comp:'quicker', sup:'quickest'},
  deep:{comp:'deeper', sup:'deepest'}, wide:{comp:'wider', sup:'widest'}, long:{comp:'longer', sup:'longest'},
  short:{comp:'shorter', sup:'shortest'}, happy:{comp:'happier', sup:'happiest'}, heavy:{comp:'heavier', sup:'heaviest'},
  beautiful:{comp:'more beautiful', sup:'most beautiful'}, interesting:{comp:'more interesting', sup:'most interesting'},
  dangerous:{comp:'more dangerous', sup:'most dangerous'}, careful:{comp:'more careful', sup:'most careful'},
  colorful:{comp:'more colorful', sup:'most colorful'}, expensive:{comp:'more expensive', sup:'most expensive'},
  delicious:{comp:'more delicious', sup:'most delicious'}
};
const irregularBank = {
  good:{comp:'better', sup:'best'}, bad:{comp:'worse', sup:'worst'},
  far:{comp:'further', sup:'furthest'}, little:{comp:'less', sup:'least'}
};
const nounPairsComp = [['elephant','mouse'],['cheetah','turtle'],['mountain','hill'],['ocean','pond'],['giant','dwarf'],['train','bicycle'],['castle','hut'],['whale','fish'],['river','stream'],['lion','kitten']];
const nounSingleSup = ['elephant','cheetah','giraffe','whale','eagle','tiger','python','panda','falcon','shark'];

function genComparative(){
  const key = pickRandom(Object.keys(adjBank));
  const adj = adjBank[key];
  const [nA,nB] = pickRandom(nounPairsComp);
  const opts = shuffle([adj.comp, key, adj.sup, pickRandom(Object.values(adjBank)).comp].filter((v,i,a)=>a.indexOf(v)===i));
  while(opts.length<4) opts.push(pickRandom(Object.values(adjBank)).sup);
  return { sentence:`The ${nA} is <span class="blank">___</span> than the ${nB}.`, correct:adj.comp, opts: shuffle(opts.slice(0,4)) };
}
function genSuperlative(){
  const key = pickRandom(Object.keys(adjBank));
  const adj = adjBank[key];
  const n = pickRandom(nounSingleSup);
  const opts = shuffle([adj.sup, key, adj.comp, pickRandom(Object.values(adjBank)).sup].filter((v,i,a)=>a.indexOf(v)===i));
  while(opts.length<4) opts.push(pickRandom(Object.values(adjBank)).comp);
  return { sentence:`Of all the animals, the ${n} is the <span class="blank">___</span>.`, correct:adj.sup, opts: shuffle(opts.slice(0,4)) };
}
function genIrregular(){
  const key = pickRandom(Object.keys(irregularBank));
  const adj = irregularBank[key];
  const useSup = Math.random()<0.5;
  const [nA,nB] = pickRandom(nounPairsComp);
  const n = pickRandom(nounSingleSup);
  if(useSup){
    const opts = shuffle([adj.sup, key, adj.comp, pickRandom(Object.values(irregularBank)).sup].filter((v,i,a)=>a.indexOf(v)===i));
    while(opts.length<4) opts.push(pickRandom(Object.values(adjBank)).sup);
    return { sentence:`Of all the players, she is the <span class="blank">___</span> at chess.`, correct:adj.sup, opts: shuffle(opts.slice(0,4)) };
  } else {
    const opts = shuffle([adj.comp, key, adj.sup, pickRandom(Object.values(irregularBank)).comp].filter((v,i,a)=>a.indexOf(v)===i));
    while(opts.length<4) opts.push(pickRandom(Object.values(adjBank)).comp);
    return { sentence:`This soup tastes <span class="blank">___</span> than the last one.`, correct:adj.comp, opts: shuffle(opts.slice(0,4)) };
  }
}

function generateFromBank(bank, count){ return shuffle(bank).slice(0,count).map(item=>({sentence:item.s, correct:item.correct, opts:shuffle(item.opts.slice())})); }
function generateGen(fn, count){
  const qs = []; const seen = new Set(); let guard=0;
  while(qs.length<count && guard<200){ guard++; const q=fn(); if(seen.has(q.sentence)) continue; seen.add(q.sentence); qs.push(q); }
  return qs;
}

const missions = [
  {title:"Basecamp of Words", diff:"Easy", badge:"🥉", emoji:"⛺", type:'bank', bank:descBank1},
  {title:"Feeling Forest", diff:"Easy", badge:"🥉", emoji:"🌲", type:'bank', bank:descBank2},
  {title:"Texture Trail", diff:"Easy-Medium", badge:"🥈", emoji:"🧗", type:'bank', bank:descBank3},
  {title:"Comparing Canyon I", diff:"Medium", badge:"🥈", emoji:"🏞️", type:'gen', fn:genComparative},
  {title:"Comparing Canyon II", diff:"Medium", badge:"🥈", emoji:"🌄", type:'gen', fn:genComparative},
  {title:"Comparing Canyon III", diff:"Medium-Hard", badge:"🥇", emoji:"🪵", type:'gen', fn:genComparative},
  {title:"Superlative Summit I", diff:"Hard", badge:"🥇", emoji:"🏕️", type:'gen', fn:genSuperlative},
  {title:"Superlative Summit II", diff:"Hard", badge:"🥇", emoji:"🎯", type:'gen', fn:genSuperlative},
  {title:"Irregular Ice Cave", diff:"Very Hard", badge:"💎", emoji:"🧊", type:'gen', fn:genIrregular},
  {title:"Peak of Adjectives", diff:"Expert", badge:"👑", emoji:"🏆", type:'mixed'}
];

function generateQuestions(mission){
  if(mission.type === 'bank') return generateFromBank(mission.bank, 10);
  if(mission.type === 'gen') return generateGen(mission.fn, 10);
  // mixed
  const gens = [genComparative, genSuperlative, genIrregular];
  const qs = [];
  for(let i=0;i<7;i++) qs.push(pickRandom(gens)());
  qs.push(...generateFromBank([...descBank1, ...descBank2, ...descBank3], 3));
  return shuffle(qs);
}

let progress = missions.map(()=>({unlocked:false, done:false, stars:0}));
progress[0].unlocked = true;
let session = null;
const card = document.getElementById('gameCard');

function renderMap(){
  const doneCount = progress.filter(p=>p.done).length;
  let html = `<div class="map-grid">`;
  missions.forEach((m,i)=>{
    const p = progress[i];
    const cls = p.done ? 'done' : (p.unlocked ? '' : 'locked');
    const icon = p.done ? m.badge : (p.unlocked ? m.emoji : '🔒');
    const stars = p.done ? '⭐'.repeat(p.stars) + '☆'.repeat(3-p.stars) : '';
    html += `
      <div class="mission-row ${cls}" onclick="${p.unlocked ? `startMission(${i})` : ''}">
        <div class="mission-num">${i+1}</div>
        <div class="mission-info">
          <div class="mission-title">${m.title}</div>
          <div class="mission-diff">${m.diff}</div>
          ${stars ? `<div class="stars-row">${stars}</div>` : ''}
        </div>
        <div class="mission-badge">${icon}</div>
      </div>`;
  });
  html += `</div>`;
  if(doneCount === missions.length){
    html += `<button class="btn-primary" style="margin-top:16px;" onclick="renderTrophy()">See Your Grand Trophy 🏆</button>`;
  }
  card.innerHTML = html;
}

function startMission(i){
  session = { missionIdx:i, qIdx:0, correctCount:0, wrongDots:[], questions: generateQuestions(missions[i]) };
  renderQuestion();
}

function renderQuestion(){
  const m = missions[session.missionIdx];
  if(session.qIdx >= session.questions.length){ renderMissionComplete(); return; }
  const q = session.questions[session.qIdx];
  let dots = '';
  for(let i=0;i<session.questions.length;i++){
    let cls = 'dot';
    if(i < session.qIdx) cls += session.wrongDots[i] ? ' wrong' : ' filled';
    dots += `<div class="${cls}"></div>`;
  }
  card.innerHTML = `
    <div class="stop-label">MISSION ${session.missionIdx+1}: ${m.title.toUpperCase()} — ${session.qIdx+1}/${session.questions.length}</div>
    <div class="progress-dots">${dots}</div>
    <div class="word-emoji">${m.emoji}</div>
    <div class="question">${q.sentence}</div>
    <div class="options" id="optionsWrap"></div>
    <div class="feedback" id="feedback"></div>
  `;
  const wrap = document.getElementById('optionsWrap');
  q.opts.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = opt;
    btn.onclick = () => handleAnswer(opt, q.correct, btn);
    wrap.appendChild(btn);
  });
}

function handleAnswer(selected, correct, btnEl){
  const buttons = document.querySelectorAll('.opt');
  if(buttons[0].disabled) return;
  const feedback = document.getElementById('feedback');
  const isCorrect = selected === correct;
  buttons.forEach(b=>{
    b.disabled = true;
    if(b.textContent === correct) b.classList.add('correct');
    else if(b === btnEl) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  if(isCorrect){
    session.correctCount++;
    session.wrongDots[session.qIdx] = false;
    feedback.textContent = pickRandom(["Great job! 🎉","Nice describing! 🌈","You got it! 🌟","Correct! 🎒"]);
    feedback.style.color = "#9C2C55";
    burstConfetti();
  } else {
    session.wrongDots[session.qIdx] = true;
    feedback.textContent = `Correct answer: ${correct}`;
    feedback.style.color = "#D64545";
  }
  setTimeout(()=>{ session.qIdx++; renderQuestion(); }, 1200);
}

function renderMissionComplete(){
  const i = session.missionIdx;
  const m = missions[i];
  const score = session.correctCount;
  let stars = score >= 9 ? 3 : score >= 6 ? 2 : 1;
  progress[i].done = true;
  progress[i].stars = Math.max(progress[i].stars, stars);
  if(i+1 < missions.length) progress[i+1].unlocked = true;
  card.innerHTML = `
    <div class="end">
      <div class="end-emoji">${m.badge}</div>
      <div class="end-title">${m.title} Complete!</div>
      <div class="end-sub">You got ${score} out of ${session.questions.length} correct</div>
      <div class="stars-big">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
      <div>
        <button class="btn-primary" onclick="renderMap()">Back to Expedition Map</button>
        ${i+1 < missions.length ? `<button class="btn-secondary" onclick="startMission(${i+1})">Next Mission →</button>` : ''}
      </div>
    </div>`;
  bigConfetti();
}

function renderTrophy(){
  const badgeList = missions.map(m=>m.badge).join(' ');
  card.innerHTML = `
    <div class="end">
      <div class="end-emoji">🏆</div>
      <div class="end-title">Adjective Master!</div>
      <div class="end-sub">You completed all 10 missions of Adjective Expedition</div>
      <div class="badge-shelf"><span>${badgeList}</span></div>
      <button class="btn-primary" onclick="resetAll()">Play Again From Start 🔁</button>
    </div>`;
  bigConfetti();
}
function resetAll(){ progress = missions.map(()=>({unlocked:false, done:false, stars:0})); progress[0].unlocked = true; renderMap(); }

function burstConfetti(){
  const layer = document.createElement('div'); layer.className = 'confetti';
  const emojis = ['🎉','⭐','🌈','🎒'];
  for(let i=0;i<10;i++){
    const s = document.createElement('span');
    s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left = (40 + Math.random()*20) + "%";
    s.style.animationDuration = (1 + Math.random()*0.6) + "s";
    s.style.fontSize = (14 + Math.random()*10) + "px";
    layer.appendChild(s);
  }
  document.body.appendChild(layer);
  setTimeout(()=>layer.remove(), 1600);
}
function bigConfetti(){
  const layer = document.createElement('div'); layer.className = 'confetti';
  const emojis = ['🎉','⭐','🌈','🎒','🏆','🌟'];
  for(let i=0;i<28;i++){
    const s = document.createElement('span');
    s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left = Math.random()*100 + "%";
    s.style.animationDuration = (1.4 + Math.random()*1.2) + "s";
    s.style.fontSize = (14 + Math.random()*14) + "px";
    layer.appendChild(s);
  }
  document.body.appendChild(layer);
  setTimeout(()=>layer.remove(), 2800);
}
renderMap();
</script>
</body>
</html>
