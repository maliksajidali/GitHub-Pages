<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Article Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sand:#FDF3E7; --sand-dark:#F8E3C6;
    --deep:#4A2E1E; --brown:#8B5A2B;
    --gold:#D9A441; --gold-light:#EFCB88;
    --sun:#FFCB47; --sun-dark:#E8A317;
    --coral:#E85D5D; --white:#FFFFFF;
    --shadow: 0 6px 0 rgba(74,46,30,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Nunito', sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(217,164,65,0.25), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(255,203,71,0.25), transparent 45%),
      var(--sand);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:20px; color:var(--deep); overflow-x:hidden;
  }
  .app{width:100%; max-width:560px;}
  .header{text-align:center; margin-bottom:16px;}
  .title{font-family:'Fredoka', sans-serif; font-weight:700; font-size:clamp(26px,7vw,36px); margin:0;}
  .title span{color:var(--brown);}
  .subtitle{font-size:13px; font-weight:700; color:var(--brown); opacity:0.8; text-transform:uppercase; letter-spacing:1.5px; margin-top:4px;}
  .card{background:var(--white); border-radius:26px; padding:24px; border:3px solid var(--deep); box-shadow:var(--shadow); min-height:380px; display:flex; flex-direction:column;}
  .map-grid{display:flex; flex-direction:column; gap:10px;}
  .mission-row{display:flex; align-items:center; gap:14px; background:var(--sand); border:3px solid var(--deep); border-radius:18px; padding:12px 14px; cursor:pointer;}
  .mission-row.locked{opacity:0.55; cursor:not-allowed;}
  .mission-row:not(.locked):active{transform:scale(0.98);}
  .mission-num{font-family:'Fredoka',sans-serif; font-weight:700; font-size:18px; width:40px; height:40px; border-radius:50%; background:var(--gold); color:white; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .mission-row.locked .mission-num{background:#B0B0B0;}
  .mission-row.done .mission-num{background:var(--sun-dark);}
  .mission-info{flex:1;}
  .mission-title{font-family:'Fredoka',sans-serif; font-weight:600; font-size:15px;}
  .mission-diff{font-size:11px; font-weight:700; color:var(--brown); opacity:0.75; text-transform:uppercase;}
  .mission-badge{font-size:26px;}
  .stars-row{font-size:13px; margin-top:2px;}
  .stop-label{font-family:'Fredoka',sans-serif; font-size:12px; font-weight:600; color:white; background:var(--brown); display:inline-block; padding:5px 14px; border-radius:20px; align-self:flex-start; margin-bottom:14px;}
  .progress-dots{display:flex; gap:5px; margin-bottom:16px; flex-wrap:wrap;}
  .dot{width:10px; height:10px; border-radius:50%; background:var(--sand-dark); border:2px solid var(--deep);}
  .dot.filled{background:var(--gold);}
  .dot.wrong{background:var(--coral);}
  .word-emoji{font-size:44px; text-align:center; margin-bottom:6px;}
  .question{font-family:'Fredoka',sans-serif; font-size:clamp(17px,4.6vw,21px); font-weight:600; text-align:center; margin:6px 0 22px 0; line-height:1.4;}
  .blank{color:var(--coral); font-weight:700;}
  .options{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:auto;}
  .opt{font-family:'Nunito',sans-serif; font-weight:800; font-size:16px; padding:14px 8px; border-radius:16px; border:3px solid var(--deep); background:var(--sand); color:var(--deep); cursor:pointer; box-shadow:0 4px 0 var(--deep); transition:transform 0.08s, box-shadow 0.08s, background 0.2s;}
  .opt:active{transform:translateY(3px); box-shadow:0 1px 0 var(--deep);}
  .opt:disabled{cursor:default;}
  .opt.correct{background:var(--gold); color:white; animation:pop 0.35s ease;}
  .opt.wrong{background:var(--coral); color:white; animation:shake 0.35s ease;}
  .opt.dim{opacity:0.45;}
  @keyframes pop{0%{transform:scale(1);} 40%{transform:scale(1.08);} 100%{transform:scale(1);}}
  @keyframes shake{0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);}}
  .feedback{text-align:center; font-family:'Fredoka',sans-serif; font-weight:600; font-size:14px; height:22px; margin-top:14px; color:var(--brown);}
  .end{text-align:center; padding:14px 0; margin:auto;}
  .end-emoji{font-size:64px; margin-bottom:10px;}
  .end-title{font-family:'Fredoka',sans-serif; font-size:24px; font-weight:700; margin:0 0 6px 0;}
  .end-sub{font-size:14px; color:var(--brown); margin-bottom:18px; font-weight:700;}
  .stars-big{font-size:30px; margin-bottom:14px;}
  .btn-primary{font-family:'Fredoka',sans-serif; font-weight:600; font-size:16px; background:var(--sun); color:var(--deep); border:3px solid var(--deep); padding:13px 26px; border-radius:18px; cursor:pointer; box-shadow:0 5px 0 var(--sun-dark); margin:4px;}
  .btn-primary:active{transform:translateY(4px); box-shadow:0 1px 0 var(--sun-dark);}
  .btn-secondary{font-family:'Fredoka',sans-serif; font-weight:600; font-size:15px; background:var(--white); color:var(--deep); border:3px solid var(--deep); padding:12px 22px; border-radius:18px; cursor:pointer; margin:4px;}
  .badge-shelf{display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:14px 0;}
  .badge-shelf span{font-size:22px;}
  .confetti{position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:hidden; z-index:50;}
  .confetti span{position:absolute; top:-20px; font-size:20px; animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg); opacity:0.9;}}
  footer{text-align:center; margin-top:14px; font-size:12px; color:var(--brown); opacity:0.65; font-weight:700;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:0.001s !important; transition-duration:0.001s !important;}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1 class="title">Article <span>Adventure</span> 🗝️</h1>
    <div class="subtitle">10 missions &middot; a / an / the / no article</div>
  </div>
  <div class="card" id="gameCard"></div>
  <footer>Choose the right article to unlock the next chamber 🏛️</footer>
</div>

<script>
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function pickRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
const ALL_OPTS = ['a','an','the','—'];
function optsWithCorrect(correct){ return shuffle(ALL_OPTS.slice()); }

/* ---- Mission 1-3 generative: a/an with straightforward nouns ---- */
const easyNouns = [
  {n:'elephant', place:'zoo'}, {n:'orange', place:'basket'}, {n:'umbrella', place:'bag'},
  {n:'apple', place:'tree'}, {n:'igloo', place:'picture book'}, {n:'ant', place:'garden'},
  {n:'owl', place:'tree'}, {n:'ostrich', place:'zoo'}, {n:'eagle', place:'sky'}, {n:'octopus', place:'ocean'},
  {n:'tiger', place:'jungle'}, {n:'dog', place:'park'}, {n:'cat', place:'house'}, {n:'banana', place:'kitchen'},
  {n:'butterfly', place:'garden'}, {n:'monkey', place:'tree'}, {n:'rabbit', place:'field'}, {n:'turtle', place:'pond'},
  {n:'lion', place:'zoo'}, {n:'snake', place:'grass'}, {n:'giraffe', place:'savannah'}, {n:'crocodile', place:'river'},
  {n:'panda', place:'forest'}, {n:'zebra', place:'plains'}, {n:'kangaroo', place:'outback'}, {n:'penguin', place:'ice'},
  {n:'whale', place:'ocean'}, {n:'seal', place:'rocks'}, {n:'fox', place:'woods'}, {n:'bear', place:'cave'}
];
function makeEasyQ(item){
  const correct = /^[aeiou]/i.test(item.n) ? 'an' : 'a';
  return { sentence: `I saw <span class="blank">___</span> ${item.n} at the ${item.place}.`, correct, opts: optsWithCorrect(correct) };
}

/* ---- Mission 2 tricky exceptions ---- */
const trickyM2 = [
  {s:'She wore a <span class="blank">___</span> uniform to school.', text:'She wore ___ uniform to school.', correct:'a'},
  {text:'He is ___ honest boy.', correct:'an'},
  {text:'They waited for ___ hour before the bus came.', correct:'an'},
  {text:'This building is ___ university.', correct:'a'},
  {text:'I saw ___ unicorn in my dream.', correct:'a'},
  {text:'It was ___ useful idea.', correct:'a'},
  {text:'The owl is ___ nocturnal bird.', correct:'an'},
  {text:'Look, that is ___ eagle in the sky!', correct:'an'},
  {text:'We ate ___ orange after lunch.', correct:'an'},
  {text:'She is ___ European traveler.', correct:'a'}
];

/* ---- Mission 4: "the" for previously mentioned/specific ---- */
const theSpecific = [
  {text:'I have a dog. ___ dog is very friendly.', correct:'the'},
  {text:'She bought a book yesterday. ___ book is on the table.', correct:'the'},
  {text:'There is a cat outside. ___ cat is meowing loudly.', correct:'the'},
  {text:'He found a key. ___ key opens the old door.', correct:'the'},
  {text:'We saw a movie last night. ___ movie was amazing.', correct:'the'},
  {text:'A boy stood at the gate. ___ boy was holding a kite.', correct:'the'},
  {text:'I bought an umbrella. ___ umbrella is bright red.', correct:'the'},
  {text:'There was a storm yesterday. ___ storm broke many trees.', correct:'the'},
  {text:'She has a parrot. ___ parrot can say her name.', correct:'the'},
  {text:'We planted a tree last year. ___ tree is taller now.', correct:'the'}
];

/* ---- Mission 5: "the" for unique things ---- */
const theUnique = [
  {text:'___ sun rises in the east.', correct:'the'},
  {text:'___ moon looked bright last night.', correct:'the'},
  {text:'___ Earth orbits around the sun.', correct:'the'},
  {text:'Look up — ___ sky is so clear today.', correct:'the'},
  {text:'She wants to be ___ president one day.', correct:'the'},
  {text:'They swam across ___ ocean in the story.', correct:'the'},
  {text:'This is ___ tallest building in the city.', correct:'the'},
  {text:'He is ___ fastest runner in our school.', correct:'the'},
  {text:'That was ___ best movie I have ever seen.', correct:'the'},
  {text:'She is ___ smartest student in the class.', correct:'the'}
];

/* ---- Mission 6: "the" with geography/superlatives ---- */
const theGeo = [
  {text:'The Nile is ___ longest river in Africa.', correct:'the'},
  {text:'They climbed ___ Himalayas last summer.', correct:'the'},
  {text:'Ships crossed ___ Pacific Ocean.', correct:'the'},
  {text:'Explorers reached ___ North Pole.', correct:'the'},
  {text:'This line on the map is ___ equator.', correct:'the'},
  {text:'He is ___ tallest boy in the class.', correct:'the'},
  {text:'That was ___ funniest joke of the day.', correct:'the'},
  {text:'She is ___ kindest teacher in the school.', correct:'the'},
  {text:'This is ___ biggest elephant in the herd.', correct:'the'},
  {text:'It was ___ coldest winter in years.', correct:'the'}
];

/* ---- Mission 7-8: advanced the/a/an practice ---- */
const advanced1 = [
  {text:'I met a scientist yesterday. ___ scientist showed me her lab.', correct:'the'},
  {text:'He gave me an idea. ___ idea helped me a lot.', correct:'the'},
  {text:'She is ___ artist who paints animals.', correct:'an'},
  {text:'This is ___ old castle near the river.', correct:'an'},
  {text:'We visited a museum. ___ museum had dinosaur bones.', correct:'the'},
  {text:'He is ___ engineer who builds bridges.', correct:'an'},
  {text:'They found a cave. ___ cave was very dark.', correct:'the'},
  {text:'She wants to buy ___ new bicycle.', correct:'a'},
  {text:'That is ___ interesting story.', correct:'an'},
  {text:'We stayed in a hotel. ___ hotel was near the beach.', correct:'the'}
];
const advanced2 = [
  {text:'He is ___ honest man who always tells the truth.', correct:'an'},
  {text:'I need ___ umbrella because it is raining.', correct:'an'},
  {text:'This is ___ university my sister attends.', correct:'a'},
  {text:'That is ___ enormous mountain in the distance.', correct:'an'},
  {text:'She adopted a puppy. ___ puppy is very playful.', correct:'the'},
  {text:'He wrote a poem. ___ poem was about the sea.', correct:'the'},
  {text:'I saw ___ owl sitting on the fence.', correct:'an'},
  {text:'This is ___ oldest tree in the forest.', correct:'the'},
  {text:'They built ___ bridge across the river.', correct:'a'},
  {text:'She is ___ only girl in her class who plays chess.', correct:'the'}
];

/* ---- Mission 9: no article with plural/uncountable ---- */
const noArticle = [
  {text:'___ Water is important for our health.', correct:'—'},
  {text:'___ Lions are strong animals.', correct:'—'},
  {text:'___ Honey is very sweet.', correct:'—'},
  {text:'___ Rice is a staple food in many countries.', correct:'—'},
  {text:'___ Birds can fly high in the sky.', correct:'—'},
  {text:'___ Music makes people feel happy.', correct:'—'},
  {text:'___ Happiness is important for a good life.', correct:'—'},
  {text:'___ Gold is a precious metal.', correct:'—'},
  {text:'___ Elephants are the largest land animals.', correct:'—'},
  {text:'___ Milk is good for strong bones.', correct:'—'}
];

const missions = [
  {title:"Gate of Sounds", diff:"Easy", badge:"🥉", emoji:"🚪", type:'easyA'},
  {title:"Tricky Echoes", diff:"Easy-Medium", badge:"🥉", emoji:"🔔", type:'list', data:trickyM2},
  {title:"Second Gate", diff:"Easy-Medium", badge:"🥈", emoji:"🗝️", type:'easyA'},
  {title:"Chamber of Memory", diff:"Medium", badge:"🥈", emoji:"🖼️", type:'list', data:theSpecific},
  {title:"Hall of Wonders", diff:"Medium", badge:"🥈", emoji:"🌞", type:'list', data:theUnique},
  {title:"Map Room", diff:"Medium-Hard", badge:"🥇", emoji:"🗺️", type:'list', data:theGeo},
  {title:"Scholar's Study", diff:"Hard", badge:"🥇", emoji:"📜", type:'list', data:advanced1},
  {title:"Deep Vault", diff:"Hard", badge:"🥇", emoji:"🏺", type:'list', data:advanced2},
  {title:"Whispering Hall", diff:"Very Hard", badge:"💎", emoji:"🫙", type:'list', data:noArticle},
  {title:"Throne of Articles", diff:"Expert", badge:"👑", emoji:"👑", type:'mixed'}
];
const fullPool = [...trickyM2, ...theSpecific, ...theUnique, ...theGeo, ...advanced1, ...advanced2, ...noArticle];

function generateQuestions(mission){
  if(mission.type === 'easyA'){
    return shuffle(easyNouns).slice(0,10).map(makeEasyQ);
  }
  if(mission.type === 'list'){
    return shuffle(mission.data).slice(0,10).map(item => ({
      sentence: item.text.replace('___', '<span class="blank">___</span>'),
      correct: item.correct, opts: optsWithCorrect(item.correct)
    }));
  }
  // mixed
  const items = shuffle(fullPool).slice(0,10);
  return items.map(item => ({
    sentence: item.text.replace('___', '<span class="blank">___</span>'),
    correct: item.correct, opts: optsWithCorrect(item.correct)
  }));
}

let progress = missions.map(()=>({unlocked:false, done:false, stars:0}));
progress[0].unlocked = true;
let session = null;
const card = document.getElementById('gameCard');

function renderMap(){
  const doneCount = progress.filter(p=>p.done).length;
  let html = `<div class="map-grid">`;
  missions.forEach((m,i)=>{
    const p = progress[i];
    const cls = p.done ? 'done' : (p.unlocked ? '' : 'locked');
    const icon = p.done ? m.badge : (p.unlocked ? m.emoji : '🔒');
    const stars = p.done ? '⭐'.repeat(p.stars) + '☆'.repeat(3-p.stars) : '';
    html += `
      <div class="mission-row ${cls}" onclick="${p.unlocked ? `startMission(${i})` : ''}">
        <div class="mission-num">${i+1}</div>
        <div class="mission-info">
          <div class="mission-title">${m.title}</div>
          <div class="mission-diff">${m.diff}</div>
          ${stars ? `<div class="stars-row">${stars}</div>` : ''}
        </div>
        <div class="mission-badge">${icon}</div>
      </div>`;
  });
  html += `</div>`;
  if(doneCount === missions.length){
    html += `<button class="btn-primary" style="margin-top:16px;" onclick="renderTrophy()">See Your Grand Trophy 🏆</button>`;
  }
  card.innerHTML = html;
}

function startMission(i){
  session = { missionIdx:i, qIdx:0, correctCount:0, wrongDots:[], questions: generateQuestions(missions[i]) };
  renderQuestion();
}

function renderQuestion(){
  const m = missions[session.missionIdx];
  if(session.qIdx >= session.questions.length){ renderMissionComplete(); return; }
  const q = session.questions[session.qIdx];
  let dots = '';
  for(let i=0;i<session.questions.length;i++){
    let cls = 'dot';
    if(i < session.qIdx) cls += session.wrongDots[i] ? ' wrong' : ' filled';
    dots += `<div class="${cls}"></div>`;
  }
  card.innerHTML = `
    <div class="stop-label">MISSION ${session.missionIdx+1}: ${m.title.toUpperCase()} — ${session.qIdx+1}/${session.questions.length}</div>
    <div class="progress-dots">${dots}</div>
    <div class="word-emoji">${m.emoji}</div>
    <div class="question">${q.sentence}</div>
    <div class="options" id="optionsWrap"></div>
    <div class="feedback" id="feedback"></div>
  `;
  const wrap = document.getElementById('optionsWrap');
  q.opts.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = opt === '—' ? 'No article (—)' : opt;
    btn.onclick = () => handleAnswer(opt, q.correct, btn);
    wrap.appendChild(btn);
  });
}

function handleAnswer(selected, correct, btnEl){
  const buttons = document.querySelectorAll('.opt');
  if(buttons[0].disabled) return;
  const feedback = document.getElementById('feedback');
  const isCorrect = selected === correct;
  buttons.forEach(b=>{
    b.disabled = true;
    const bVal = b.textContent === 'No article (—)' ? '—' : b.textContent;
    if(bVal === correct) b.classList.add('correct');
    else if(b === btnEl) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  if(isCorrect){
    session.correctCount++;
    session.wrongDots[session.qIdx] = false;
    feedback.textContent = pickRandom(["Great job! 🎉","Nicely spotted! 🗝️","You got it! 🌟","Correct! 🏺"]);
    feedback.style.color = "#D9A441";
    burstConfetti();
  } else {
    session.wrongDots[session.qIdx] = true;
    feedback.textContent = `Correct answer: ${correct === '—' ? 'No article' : correct}`;
    feedback.style.color = "#E85D5D";
  }
  setTimeout(()=>{ session.qIdx++; renderQuestion(); }, 1200);
}

function renderMissionComplete(){
  const i = session.missionIdx;
  const m = missions[i];
  const score = session.correctCount;
  let stars = score >= 9 ? 3 : score >= 6 ? 2 : 1;
  progress[i].done = true;
  progress[i].stars = Math.max(progress[i].stars, stars);
  if(i+1 < missions.length) progress[i+1].unlocked = true;
  card.innerHTML = `
    <div class="end">
      <div class="end-emoji">${m.badge}</div>
      <div class="end-title">${m.title} Complete!</div>
      <div class="end-sub">You got ${score} out of ${session.questions.length} correct</div>
      <div class="stars-big">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
      <div>
        <button class="btn-primary" onclick="renderMap()">Back to Adventure Map</button>
        ${i+1 < missions.length ? `<button class="btn-secondary" onclick="startMission(${i+1})">Next Mission →</button>` : ''}
      </div>
    </div>`;
  bigConfetti();
}

function renderTrophy(){
  const badgeList = missions.map(m=>m.badge).join(' ');
  card.innerHTML = `
    <div class="end">
      <div class="end-emoji">🏆</div>
      <div class="end-title">Article Master!</div>
      <div class="end-sub">You completed all 10 missions of Article Adventure</div>
      <div class="badge-shelf"><span>${badgeList}</span></div>
      <button class="btn-primary" onclick="resetAll()">Play Again From Start 🔁</button>
    </div>`;
  bigConfetti();
}
function resetAll(){ progress = missions.map(()=>({unlocked:false, done:false, stars:0})); progress[0].unlocked = true; renderMap(); }

function burstConfetti(){
  const layer = document.createElement('div'); layer.className = 'confetti';
  const emojis = ['🎉','⭐','🗝️','🏺'];
  for(let i=0;i<10;i++){
    const s = document.createElement('span');
    s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left = (40 + Math.random()*20) + "%";
    s.style.animationDuration = (1 + Math.random()*0.6) + "s";
    s.style.fontSize = (14 + Math.random()*10) + "px";
    layer.appendChild(s);
  }
  document.body.appendChild(layer);
  setTimeout(()=>layer.remove(), 1600);
}
function bigConfetti(){
  const layer = document.createElement('div'); layer.className = 'confetti';
  const emojis = ['🎉','⭐','🗝️','🏺','🏆','🌟'];
  for(let i=0;i<28;i++){
    const s = document.createElement('span');
    s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left = Math.random()*100 + "%";
    s.style.animationDuration = (1.4 + Math.random()*1.2) + "s";
    s.style.fontSize = (14 + Math.random()*14) + "px";
    layer.appendChild(s);
  }
  document.body.appendChild(layer);
  setTimeout(()=>layer.remove(), 2800);
}
renderMap();
</script>
</body>
</html>
