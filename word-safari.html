<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Word Safari - English Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sand:#FFF8E7;
    --sand-dark:#FCEFCB;
    --jungle-deep:#1B4332;
    --jungle:#2D6A4F;
    --leaf:#52B788;
    --leaf-light:#95D5B2;
    --sun:#FFD60A;
    --sun-dark:#F4A100;
    --coral:#FF6B6B;
    --sky:#7BD3EA;
    --white:#FFFFFF;
    --shadow: 0 6px 0 rgba(27,67,50,0.18);
    --shadow-sm: 0 4px 0 rgba(27,67,50,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Nunito', sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(82,183,144,0.25), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(255,214,10,0.25), transparent 45%),
      var(--sand);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    color:var(--jungle-deep);
    overflow-x:hidden;
  }
  body::before{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:-1;
    background-image:
      radial-gradient(circle at 50% 50%, transparent 60%, rgba(27,67,50,0.04) 100%);
  }
  .app{ width:100%; max-width:560px; }

  /* ---------- Header ---------- */
  .header{ text-align:center; margin-bottom:18px; }
  .title{
    font-family:'Fredoka', sans-serif; font-weight:700;
    font-size:clamp(28px,7vw,38px); color:var(--jungle-deep);
    margin:0; letter-spacing:0.5px;
  }
  .title span{ color:var(--leaf); }
  .subtitle{
    font-size:14px; font-weight:700; color:var(--jungle);
    opacity:0.75; margin-top:4px;
    text-transform:uppercase; letter-spacing:1.5px;
  }

  /* ---------- Trail / Stats ---------- */
  .trail-wrap{
    background:var(--white); border-radius:20px;
    padding:14px 16px; margin-bottom:16px;
    box-shadow:var(--shadow); border:3px solid var(--jungle-deep);
  }
  .trail-top{
    display:flex; justify-content:space-between;
    align-items:center; margin-bottom:8px;
    flex-wrap:wrap; gap:8px;
  }
  .stat{
    font-family:'Fredoka', sans-serif; font-weight:600;
    font-size:14px; display:flex; align-items:center; gap:6px;
  }
  .stat.score{ color:var(--sun-dark); }
  .stat.streak{ color:var(--coral); }
  .stat.timer{ color:var(--jungle); }
  .trail{
    position:relative; height:34px;
    background:var(--sand-dark); border-radius:20px; overflow:hidden;
    border:2px solid rgba(27,67,50,0.08);
  }
  .trail-fill{
    position:absolute; top:0; left:0; bottom:0;
    background:linear-gradient(90deg, var(--leaf-light), var(--leaf));
    border-radius:20px;
    transition:width 0.6s cubic-bezier(.34,1.56,.64,1);
    display:flex; align-items:center; justify-content:flex-end;
  }
  .mascot{
    font-size:22px;
    transform:translateX(50%);
    transition:transform 0.3s;
  }

  /* ---------- Card ---------- */
  .card{
    background:var(--white); border-radius:26px;
    padding:28px 24px; border:3px solid var(--jungle-deep);
    box-shadow:var(--shadow); position:relative; min-height:340px;
    display:flex; flex-direction:column;
  }
  .card-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px; flex-wrap:wrap; }
  .stop-label{
    font-family:'Fredoka', sans-serif; font-size:12px;
    font-weight:600; color:var(--white); background:var(--jungle);
    display:inline-block; padding:5px 14px; border-radius:20px;
    letter-spacing:0.5px;
  }
  .category-pill{
    font-family:'Fredoka', sans-serif; font-size:12px;
    font-weight:600; color:var(--jungle-deep); background:var(--sun);
    padding:5px 14px; border-radius:20px; border:2px solid var(--jungle-deep);
    letter-spacing:0.5px;
  }
  .question-emoji{
    font-size:62px; text-align:center; margin:8px 0 4px 0; line-height:1;
  }
  .question{
    font-family:'Fredoka', sans-serif;
    font-size:clamp(18px,4.5vw,22px); font-weight:600;
    text-align:center; color:var(--jungle-deep);
    margin:8px 0 18px 0; line-height:1.35;
  }

  /* ---------- Options ---------- */
  .options{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:auto; }
  .opt{
    font-family:'Nunito', sans-serif; font-weight:800; font-size:16px;
    padding:16px 10px; border-radius:16px;
    border:3px solid var(--jungle-deep); background:var(--sand);
    color:var(--jungle-deep); cursor:pointer;
    box-shadow:0 4px 0 var(--jungle-deep);
    transition:transform 0.08s ease, box-shadow 0.08s ease, background 0.2s;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--jungle-deep); }
  .opt:disabled{ cursor:default; }
  .opt.correct{ background:var(--leaf); color:var(--white); animation:pop 0.35s ease; }
  .opt.wrong{ background:var(--coral); color:var(--white); animation:shake 0.35s ease; }
  .opt.dim{ opacity:0.45; }
  .opt.hint{ background:var(--sky); animation:none; }

  @keyframes pop{
    0%{transform:scale(1);} 40%{transform:scale(1.08);} 100%{transform:scale(1);}
  }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-6px);}
    75%{transform:translateX(6px);}
  }
  .feedback{
    text-align:center; font-family:'Fredoka', sans-serif;
    font-weight:600; font-size:15px; height:22px;
    margin-top:14px; color:var(--jungle);
  }

  /* ---------- Controls row ---------- */
  .controls-row{
    display:flex; justify-content:space-between; gap:10px; margin-top:14px;
  }
  .btn-tool{
    font-family:'Fredoka', sans-serif; font-size:13px; font-weight:600;
    padding:9px 16px; border-radius:14px;
    border:3px solid var(--jungle-deep); background:var(--sand);
    color:var(--jungle-deep); cursor:pointer;
    box-shadow:var(--shadow-sm); flex:1;
    -webkit-tap-highlight-color:transparent;
    transition:transform 0.08s, box-shadow 0.08s;
  }
  .btn-tool:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--jungle-deep); }
  .btn-tool:disabled{ opacity:0.45; cursor:default; }
  .btn-tool.flash{ animation:pop 0.4s ease; }

  /* ---------- Setup screen ---------- */
  .setup-title{
    font-family:'Fredoka', sans-serif; font-size:22px; font-weight:700;
    text-align:center; color:var(--jungle-deep); margin:4px 0 14px 0;
  }
  .setup-sub{
    text-align:center; font-size:14px; font-weight:700;
    color:var(--jungle); margin-bottom:18px;
  }
  .group-label{
    font-family:'Fredoka', sans-serif; font-size:12px; font-weight:600;
    color:var(--jungle); text-transform:uppercase; letter-spacing:1px;
    margin:6px 0 8px 0;
  }
  .chips{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px; }
  .chip{
    font-family:'Nunito', sans-serif; font-weight:800; font-size:14px;
    padding:14px 6px; border-radius:14px; text-align:center;
    background:var(--sand); color:var(--jungle-deep); cursor:pointer;
    border:3px solid var(--jungle-deep); box-shadow:0 4px 0 var(--jungle-deep);
    transition:transform 0.08s, box-shadow 0.08s, background 0.2s;
    -webkit-tap-highlight-color:transparent;
  }
  .chip:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--jungle-deep); }
  .chip.selected{ background:var(--leaf); color:var(--white); }
  .chip .chip-emoji{ display:block; font-size:22px; margin-bottom:4px; }

  /* ---------- End screen ---------- */
  .end{ text-align:center; padding:14px 0; }
  .end-emoji{ font-size:64px; margin-bottom:8px; }
  .end-title{
    font-family:'Fredoka', sans-serif; font-size:26px; font-weight:700;
    color:var(--jungle-deep); margin:0 0 8px 0;
  }
  .end-sub{ font-size:15px; color:var(--jungle); margin-bottom:14px; font-weight:700; }
  .end-grid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
    margin:16px 0;
  }
  .end-card{
    background:var(--sand); border-radius:14px; padding:12px 6px;
    border:3px solid var(--jungle-deep);
  }
  .end-card .num{
    font-family:'Fredoka', sans-serif; font-weight:700;
    font-size:22px; color:var(--jungle-deep); display:block;
  }
  .end-card .lbl{
    font-size:11px; font-weight:700; color:var(--jungle);
    text-transform:uppercase; letter-spacing:1px; margin-top:2px;
  }
  .end-btns{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:6px; }
  .btn-primary{
    font-family:'Fredoka', sans-serif; font-weight:600; font-size:17px;
    background:var(--sun); color:var(--jungle-deep);
    border:3px solid var(--jungle-deep); padding:14px 26px;
    border-radius:18px; cursor:pointer;
    box-shadow:0 5px 0 var(--sun-dark);
    transition:transform 0.08s, box-shadow 0.08s;
    -webkit-tap-highlight-color:transparent;
  }
  .btn-primary:active{ transform:translateY(4px); box-shadow:0 1px 0 var(--sun-dark); }
  .btn-secondary{
    font-family:'Fredoka', sans-serif; font-weight:600; font-size:15px;
    background:var(--white); color:var(--jungle-deep);
    border:3px solid var(--jungle-deep); padding:12px 20px;
    border-radius:18px; cursor:pointer;
    box-shadow:0 4px 0 var(--jungle-deep);
    transition:transform 0.08s, box-shadow 0.08s;
    -webkit-tap-highlight-color:transparent;
  }
  .btn-secondary:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--jungle-deep); }

  /* ---------- Confetti ---------- */
  .confetti{
    position:fixed; top:0; left:0; width:100%; height:100%;
    pointer-events:none; overflow:hidden; z-index:50;
  }
  .confetti span{
    position:absolute; top:-20px; font-size:20px;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{ transform:translateY(110vh) rotate(360deg); opacity:0.9; }
  }

  /* ---------- Floating mascot ---------- */
  .float-mascot{
    position:fixed; right:20px; bottom:16px; font-size:36px;
    pointer-events:none; opacity:0.7; animation:bob 3.2s ease-in-out infinite;
    z-index:5;
  }
  @keyframes bob{
    0%,100%{transform:translateY(0) rotate(-4deg);}
    50%{transform:translateY(-8px) rotate(4deg);}
  }

  footer{
    text-align:center; margin-top:16px; font-size:12px;
    color:var(--jungle); opacity:0.7; font-weight:700;
  }
  footer .high{ color:var(--coral); }

  @media (max-width:420px){
    .options{ grid-template-columns:1fr; }
    .chips{ grid-template-columns:repeat(2,1fr); }
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001s !important; transition-duration:0.001s !important;}
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1 class="title">Word <span>Safari</span> 🌿</h1>
    <div class="subtitle">an english adventure</div>
  </div>

  <div class="trail-wrap" id="trailWrap" style="display:none;">
    <div class="trail-top">
      <div class="stat score">⭐ <span id="scoreVal">0</span> pts</div>
      <div class="stat timer" id="timerBox">⏱ <span id="timerVal">0</span>s</div>
      <div class="stat streak">🔥 <span id="streakVal">0</span></div>
    </div>
    <div class="trail">
      <div class="trail-fill" id="trailFill" style="width:0%">
        <span class="mascot">🐒</span>
      </div>
    </div>
  </div>

  <div class="card" id="gameCard">
    <!-- filled by JS -->
  </div>

  <footer>
    <span id="footerMsg">Pick a category & difficulty to begin 🐾</span>
    <div id="highLine" style="display:none;">🏆 Best: <span class="high" id="highVal">0</span> pts</div>
  </footer>
</div>

<div class="float-mascot" id="floatMascot" style="display:none;">🦒</div>

<script>
/* ------------------- QUESTION BANK ------------------- */
const BANK = {
  animals: [
    { emoji:"🦁", q:"What is the baby of a lion called?", opts:["Cub","Kitten","Pup","Foal"], a:"Cub" },
    { emoji:"🐘", q:"Which animal has the longest nose?", opts:["Rhino","Elephant","Hippo","Horse"], a:"Elephant" },
    { emoji:"🦓", q:"A zebra's stripes are mostly...", opts:["Brown & white","Black & white","Grey & black","Black & yellow"], a:"Black & white" },
    { emoji:"🐒", q:"Which animal is known as 'king of the jungle'?", opts:["Tiger","Bear","Lion","Cheetah"], a:"Lion" },
    { emoji:"🦒", q:"What is special about a giraffe's tongue?", opts:["It's blue","It's purple","It's short","It glows"], a:"It's purple" },
    { emoji:"🐍", q:"Snakes have no...", opts:["Skin","Bones","Legs","Eyes"], a:"Legs" },
    { emoji:"🦜", q:"What can parrots do that most birds can't?", opts:["Swim","Mimic speech","Fly backward","Sleep standing"], a:"Mimic speech" },
    { emoji:"🐊", q:"Which is the largest reptile on Earth?", opts:["Komodo dragon","Saltwater crocodile","Anaconda","Gharial"], a:"Saltwater crocodile" },
    { emoji:"🦒", q:"Giraffes mostly eat...", opts:["Fish","Leaves","Meat","Insects"], a:"Leaves" },
    { emoji:"🦓", q:"Which animal runs the fastest?", opts:["Lion","Horse","Cheetah","Greyhound"], a:"Cheetah" }
  ],
  nature: [
    { emoji:"🌴", q:"A place with many trees is a...", opts:["Desert","Forest","Ocean","Cave"], a:"Forest" },
    { emoji:"🌋", q:"Which natural event involves hot melted rock?", opts:["Blizzard","Volcano","Tornado","Aurora"], a:"Volcano" },
    { emoji:"🌊", q:"The largest ocean on Earth is the...", opts:["Atlantic","Indian","Arctic","Pacific"], a:"Pacific" },
    { emoji:"🌈", q:"A rainbow has how many colors?", opts:["5","6","7","8"], a:"7" },
    { emoji:"❄️", q:"What is frozen water called?", opts:["Steam","Ice","Mist","Dew"], a:"Ice" },
    { emoji:"🌪️", q:"A spinning storm with strong winds is a...", opts:["Tornado","Fog","Breeze","Drizzle"], a:"Tornado" },
    { emoji:"🌞", q:"Which planet is closest to the Sun?", opts:["Venus","Mercury","Mars","Earth"], a:"Mercury" },
    { emoji:"🌙", q:"The Moon goes around the Earth about every...", opts:["1 day","7 days","27 days","365 days"], a:"27 days" },
    { emoji:"🌸", q:"Which season comes after winter?", opts:["Summer","Autumn","Spring","Monsoon"], a:"Spring" },
    { emoji:"☁️", q:"White, fluffy shapes in the sky are...", opts:["Clouds","Smoke","Birds","Stars"], a:"Clouds" }
  ],
  grammar: [
    { emoji:"📖", q:"She ___ to school every day.", opts:["go","goes","going","went"], a:"goes" },
    { emoji:"📚", q:"Which is a noun?", opts:["Run","Happy","School","Quickly"], a:"School" },
    { emoji:"✏️", q:"Past tense of 'eat'?", opts:["Eated","Ate","Eaten","Eating"], a:"Ate" },
    { emoji:"📝", q:"Choose the correct sentence.", opts:["He don't like fish.","He doesn't likes fish.","He doesn't like fish.","He not like fish."], a:"He doesn't like fish." },
    { emoji:"🧠", q:"Plural of 'child'?", opts:["Childs","Children","Childes","Childer"], a:"Children" },
    { emoji:"🔤", q:"Which word is a verb?", opts:["Blue","Jump","Soft","Quick"], a:"Jump" },
    { emoji:"📖", q:"I ___ a book right now.", opts:["read","reads","am reading","reading"], a:"am reading" },
    { emoji:"🗣️", q:"Comparative of 'happy'?", opts:["Happyer","Happier","More happy","Most happy"], a:"Happier" },
    { emoji:"🌟", q:"Which is an adjective?", opts:["Run","Quickly","Tall","Sing"], a:"Tall" },
    { emoji:"📕", q:"'She is ___ than her sister.'", opts:["tall","taller","more tall","most tall"], a:"taller" }
  ],
  spelling: [
    { emoji:"🔤", q:"Which is spelled correctly?", opts:["Freind","Friend","FRIENED","Frend"], a:"Friend" },
    { emoji:"🦋", q:"Choose the correct spelling.", opts:["Butterfli","Buterfly","Butterfly","Buttafly"], a:"Butterfly" },
    { emoji:"🌍", q:"Which is spelled correctly?", opts:["Beutiful","Beautful","Beautiful","Beautifol"], a:"Beautiful" },
    { emoji:"🍎", q:"Which spelling is right?", opts:["Aple","Apple","Apel","Appel"], a:"Apple" },
    { emoji:"🏫", q:"Which is spelled correctly?", opts:["Skool","Scool","School","Skul"], a:"School" },
    { emoji:"🐘", q:"Pick the correct word.", opts:["Elefant","Elephent","Elephant","Elefantt"], a:"Elephant" },
    { emoji:"🌈", q:"Which is spelled right?", opts:["Rainboe","Rainbow","Rainbo","Rainbnow"], a:"Rainbow" },
    { emoji:"🎵", q:"Which is spelled correctly?", opts:["Mussic","Music","Musik","Muzic"], a:"Music" },
    { emoji:"✨", q:"Which word is right?", opts:["Magick","Magik","Magic","Majic"], a:"Magic" },
    { emoji:"🌟", q:"Which is spelled correctly?", opts:["Familly","Familye","Family","Famely"], a:"Family" }
  ]
};

const CATS = [
  { id:"animals",  label:"Animals",  emoji:"🦁" },
  { id:"nature",   label:"Nature",   emoji:"🌴" },
  { id:"grammar",  label:"Grammar",  emoji:"📖" },
  { id:"spelling", label:"Spelling", emoji:"🔤" }
];
const LEVELS = [
  { id:"easy",   label:"Easy 🐢", count:8,  time:null },
  { id:"medium", label:"Medium 🦊", count:10, time:null },
  { id:"hard",   label:"Hard 🦁", count:12, time:20 }
];

/* ------------------- STATE ------------------- */
let state = {
  cat: null, level: null,
  order: [], idx: 0, score: 0, streak: 0,
  bestStreak: 0, correct: 0, hints: 1,
  answered: false, timeLeft: 0, timerInt: null
};

/* ------------------- DOM ------------------- */
const card = document.getElementById('gameCard');
const trailWrap = document.getElementById('trailWrap');
const scoreVal = document.getElementById('scoreVal');
const streakVal = document.getElementById('streakVal');
const timerVal = document.getElementById('timerVal');
const timerBox = document.getElementById('timerBox');
const trailFill = document.getElementById('trailFill');
const footerMsg = document.getElementById('footerMsg');
const highLine = document.getElementById('highLine');
const highVal = document.getElementById('highVal');
const floatMascot = document.getElementById('floatMascot');

/* ------------------- UTILS ------------------- */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function getHighScore(){
  try{ return parseInt(localStorage.getItem('ws_high')||'0',10) || 0; }catch(e){ return 0; }
}
function setHighScore(v){
  try{ localStorage.setItem('ws_high', String(v)); }catch(e){}
}

/* ------------------- SOUND (Web Audio) ------------------- */
let audioCtx = null;
function audio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx = null; }
  }
  return audioCtx;
}
function beep(freq=440, dur=0.12, type='sine', vol=0.15){
  const ctx = audio(); if(!ctx) return;
  const o = ctx.createOscillator(); const g = ctx.createGain();
  o.type = type; o.frequency.value = freq;
  o.connect(g); g.connect(ctx.destination);
  g.gain.setValueAtTime(0, ctx.currentTime);
  g.gain.linearRampToValueAtTime(vol, ctx.currentTime + 0.01);
  g.gain.linearRampToValueAtTime(0, ctx.currentTime + dur);
  o.start(); o.stop(ctx.currentTime + dur + 0.02);
}
function sfxCorrect(){ beep(660,0.1,'triangle',0.18); setTimeout(()=>beep(880,0.1,'triangle',0.16), 90); }
function sfxWrong(){ beep(180,0.15,'sawtooth',0.18); setTimeout(()=>beep(140,0.18,'sawtooth',0.14), 100); }
function sfxHint(){ beep(520,0.08,'sine',0.14); }
function sfxEnd(){
  [523,659,784,1047].forEach((f,i)=> setTimeout(()=>beep(f,0.18,'triangle',0.18), i*120));
}

/* ------------------- RENDER: SETUP ------------------- */
function renderSetup(){
  trailWrap.style.display = 'none';
  floatMascot.style.display = 'block';
  footerMsg.textContent = 'Pick a category & difficulty to begin 🐾';
  const h = getHighScore();
  if(h>0){ highLine.style.display = 'block'; highVal.textContent = h; } else { highLine.style.display = 'none'; }

  card.innerHTML = `
    <div class="setup-title">Ready for a safari? 🐾</div>
    <div class="setup-sub">Choose a category and a difficulty.</div>

    <div class="group-label">Category</div>
    <div class="chips" id="catChips">
      ${CATS.map(c => `
        <div class="chip ${state.cat===c.id?'selected':''}" data-cat="${c.id}">
          <span class="chip-emoji">${c.emoji}</span>${c.label}
        </div>`).join('')}
    </div>

    <div class="group-label">Difficulty</div>
    <div class="chips" id="lvlChips">
      ${LEVELS.map(l => `
        <div class="chip ${state.level===l.id?'selected':''}" data-lvl="${l.id}">
          ${l.label}
        </div>`).join('')}
    </div>

    <div style="text-align:center; margin-top:10px;">
      <button class="btn-primary" id="startBtn" ${(!state.cat||!state.level)?'disabled style="opacity:0.5;cursor:default;"':''}>
        Start Safari 🚀
      </button>
    </div>
    <div class="feedback" style="visibility:hidden;">.</div>
  `;

  document.querySelectorAll('#catChips .chip').forEach(el => {
    el.onclick = () => { state.cat = el.dataset.cat; renderSetup(); speak('Category set: '+CATS.find(c=>c.id===state.cat).label); };
  });
  document.querySelectorAll('#lvlChips .chip').forEach(el => {
    el.onclick = () => { state.level = el.dataset.level; renderSetup(); speak('Difficulty set: '+LEVELS.find(l=>l.id===state.level).label); };
  });

  const btn = document.getElementById('startBtn');
  btn.onclick = () => { if(state.cat && state.level){ startGame(); } };
}

function speak(_msg){ /* small visual cue: pulse mascot */
  floatMascot.animate(
    [{transform:'translateY(0) rotate(-4deg)'},{transform:'translateY(-14px) rotate(8deg)'},{transform:'translateY(0) rotate(-4deg)'}],
    {duration:380, easing:'cubic-bezier(.34,1.56,.64,1)'}
  );
}

/* ------------------- RENDER: QUESTION ------------------- */
function startGame(){
  const lvl = LEVELS.find(l=>l.id===state.level);
  const pool = BANK[state.cat].slice();
  state.order = shuffle(pool).slice(0, lvl.count);
  state.idx = 0; state.score = 0; state.streak = 0;
  state.bestStreak = 0; state.correct = 0;
  state.hints = lvl.id==='easy' ? 3 : lvl.id==='medium' ? 2 : 1;
  state.answered = false;
  trailWrap.style.display = 'block';
  floatMascot.style.display = 'none';
  footerMsg.textContent = 'Tap the correct answer to move along the trail 🐾';
  updateStats();
  updateTrail();
  if(lvl.time){ startTimer(lvl.time); } else { stopTimer(); timerBox.style.display='none'; }
  renderQuestion();
}

function startTimer(seconds){
  stopTimer();
  state.timeLeft = seconds;
  timerBox.style.display = 'flex';
  timerVal.textContent = state.timeLeft;
  state.timerInt = setInterval(()=>{
    state.timeLeft--;
    timerVal.textContent = state.timeLeft;
    if(state.timeLeft <= 5){ timerVal.style.color = '#FF6B6B'; }
    if(state.timeLeft <= 0){
      stopTimer();
      forceTimeout();
    }
  }, 1000);
}
function stopTimer(){
  if(state.timerInt){ clearInterval(state.timerInt); state.timerInt = null; }
  timerVal.style.color = '';
}

function forceTimeout(){
  if(state.answered) return;
  state.answered = true;
  const buttons = document.querySelectorAll('.opt');
  const item = state.order[state.idx];
  buttons.forEach(b=>{
    b.disabled = true;
    if(b.textContent === item.a){ b.classList.add('correct'); }
    else { b.classList.add('dim'); }
  });
  state.streak = 0;
  updateStats();
  const fb = document.getElementById('feedback');
  fb.textContent = "⏱ Time's up!"; fb.style.color = '#FF6B6B';
  setTimeout(()=>{ state.idx++; updateTrail(); renderQuestion(); }, 1300);
}

function updateStats(){
  scoreVal.textContent = state.score;
  streakVal.textContent = state.streak;
}
function updateTrail(){
  const pct = Math.round((state.idx / state.order.length) * 100);
  trailFill.style.width = pct + '%';
}

function renderQuestion(){
  if(state.idx >= state.order.length){
    renderEnd();
    return;
  }
  const item = state.order[state.idx];
  const opts = shuffle(item.opts);
  state.answered = false;

  const lvl = LEVELS.find(l=>l.id===state.level);

  card.innerHTML = `
    <div class="card-row">
      <span class="stop-label">STOP ${state.idx+1} / ${state.order.length}</span>
      <span class="category-pill">${CATS.find(c=>c.id===state.cat).emoji} ${CATS.find(c=>c.id===state.cat).label}</span>
    </div>
    <div class="question-emoji">${item.emoji}</div>
    <div class="question">${item.q}</div>
    <div class="options" id="optionsWrap"></div>
    <div class="controls-row">
      <button class="btn-tool" id="hintBtn" ${state.hints<=0?'disabled':''}>💡 Hint (${state.hints})</button>
      <button class="btn-tool" id="skipBtn">⏭ Skip</button>
    </div>
    <div class="feedback" id="feedback"></div>
  `;

  const wrap = document.getElementById('optionsWrap');
  opts.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = opt;
    btn.onclick = () => handleAnswer(opt, item.a, btn);
    wrap.appendChild(btn);
  });

  document.getElementById('hintBtn').onclick = useHint;
  document.getElementById('skipBtn').onclick = skipQuestion;

  if(lvl.time){ restartPerQuestionTimer(lvl.time); }
}

function restartPerQuestionTimer(seconds){
  stopTimer();
  state.timeLeft = seconds;
  timerBox.style.display = 'flex';
  timerVal.textContent = state.timeLeft;
  state.timerInt = setInterval(()=>{
    state.timeLeft--;
    timerVal.textContent = state.timeLeft;
    if(state.timeLeft <= 5){ timerVal.style.color = '#FF6B6B'; }
    if(state.timeLeft <= 0){ stopTimer(); forceTimeout(); }
  }, 1000);
}

function handleAnswer(selected, correct, btnEl){
  if(state.answered) return;
  state.answered = true;
  stopTimer();
  const buttons = document.querySelectorAll('.opt');
  const feedback = document.getElementById('feedback');

  buttons.forEach(b=>{
    b.disabled = true;
    if(b.textContent === correct){ b.classList.add('correct'); }
    else if(b === btnEl){ b.classList.add('wrong'); }
    else { b.classList.add('dim'); }
  });

  if(selected === correct){
    const bonus = state.streak * 2;
    state.score += 10 + bonus;
    state.streak += 1;
    if(state.streak > state.bestStreak) state.bestStreak = state.streak;
    state.correct += 1;
    feedback.textContent = pickPraise();
    feedback.style.color = "#2D6A4F";
    sfxCorrect();
    burstConfetti();
  } else {
    state.streak = 0;
    feedback.textContent = "Not quite — the right answer is highlighted!";
    feedback.style.color = "#FF6B6B";
    sfxWrong();
  }
  updateStats();

  setTimeout(()=>{ state.idx++; updateTrail(); renderQuestion(); }, 1200);
}

function useHint(){
  if(state.answered || state.hints<=0) return;
  state.hints -= 1;
  sfxHint();
  const item = state.order[state.idx];
  const buttons = Array.from(document.querySelectorAll('.opt'));
  const wrong = buttons.filter(b => b.textContent !== item.a);
  shuffle(wrong).slice(0, wrong.length>=2 ? 2 : 1).forEach(b => b.classList.add('dim'));
  const fb = document.getElementById('feedback');
  fb.textContent = "💡 Two wrong answers dimmed.";
  fb.style.color = "#7BD3EA";
  const hb = document.getElementById('hintBtn');
  hb.classList.remove('flash'); void hb.offsetWidth; hb.classList.add('flash');
  hb.textContent = state.hints>0 ? `💡 Hint (${state.hints})` : '💡 No hints';
  if(state.hints<=0){ hb.disabled = true; }
}

function skipQuestion(){
  if(state.answered) return;
  state.answered = true;
  stopTimer();
  state.streak = 0;
  const item = state.order[state.idx];
  const buttons = document.querySelectorAll('.opt');
  buttons.forEach(b=>{
    b.disabled = true;
    if(b.textContent === item.a){ b.classList.add('correct'); }
    else { b.classList.add('dim'); }
  });
  const fb = document.getElementById('feedback');
  fb.textContent = "⏭ Skipped! Score: 0 for this one.";
  fb.style.color = "#F4A100";
  updateStats();
  setTimeout(()=>{ state.idx++; updateTrail(); renderQuestion(); }, 1100);
}

function pickPraise(){
  const p = ["Great job! 🎉","Nice one! 🐒","You got it! 🌟","Awesome! 🦋","Correct! 🍃","Brilliant! 🌿","Safari star! 🦒"];
  return p[Math.floor(Math.random()*p.length)];
}

/* ------------------- RENDER: END ------------------- */
function renderEnd(){
  trailFill.style.width = "100%";
  stopTimer();
  floatMascot.style.display = 'block';
  footerMsg.textContent = 'Nice run! Try another safari 🐾';

  const total = state.order.length;
  let msg, emoji;
  const pct = state.score / (total * 12);
  if(pct >= 0.85){ msg="Safari Champion!"; emoji="🏆"; }
  else if(pct >= 0.6){ msg="Great Explorer!"; emoji="🦁"; }
  else if(pct >= 0.3){ msg="Keep Exploring!"; emoji="🌱"; }
  else { msg="Junior Tracker!"; emoji="🐾"; }

  const prevHigh = getHighScore();
  let newRecord = false;
  if(state.score > prevHigh){ setHighScore(state.score); newRecord = true; }

  card.innerHTML = `
    <div class="end">
      <div class="end-emoji">${emoji}</div>
      <div class="end-title">${msg}</div>
      <div class="end-sub">${newRecord ? '🏅 New personal best!' : 'You scored '+state.score+' points on your safari!'}</div>
      <div class="end-grid">
        <div class="end-card"><span class="num">${state.score}</span><div class="lbl">Score</div></div>
        <div class="end-card"><span class="num">${state.correct}/${total}</span><div class="lbl">Correct</div></div>
        <div class="end-card"><span class="num">${state.bestStreak}</span><div class="lbl">Best Streak</div></div>
      </div>
      <div class="end-btns">
        <button class="btn-primary" onclick="startGame()">Play Again 🔁</button>
        <button class="btn-secondary" onclick="renderSetup()">New Safari 🐾</button>
      </div>
    </div>
  `;
  if(newRecord){ sfxEnd(); }
  bigConfetti();
}

/* ------------------- CONFETTI ------------------- */
function burstConfetti(){
  const layer = document.createElement('div');
  layer.className = 'confetti';
  const emojis = ['🎉','⭐','🍃','🦋'];
  for(let i=0;i<10;i++){
    const s = document.createElement('span');
    s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left = (35 + Math.random()*30) + '%';
    s.style.animationDuration = (1 + Math.random()*0.6) + 's';
    s.style.fontSize = (14 + Math.random()*10) + 'px';
    layer.appendChild(s);
  }
  document.body.appendChild(layer);
  setTimeout(()=>layer.remove(), 1700);
}
function bigConfetti(){
  const layer = document.createElement('div');
  layer.className = 'confetti';
  const emojis = ['🎉','⭐','🍃','🦋','🏆','🌟','🐒','🦒'];
  for(let i=0;i<40;i++){
    const s = document.createElement('span');
    s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left = Math.random()*100 + '%';
    s.style.animationDuration = (1.4 + Math.random()*1.4) + 's';
    s.style.fontSize = (14 + Math.random()*16) + 'px';
    layer.appendChild(s);
  }
  document.body.appendChild(layer);
  setTimeout(()=>layer.remove(), 3000);
}

/* ------------------- INIT ------------------- */
renderSetup();
</script>
