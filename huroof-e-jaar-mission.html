<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>حروفِ جار مہم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --sand:#E9F3FB; --sand-dark:#D2E7F7; --deep:#0E3050; --jungle:#175A8C; --leaf:#3A8FCC; --leaf-light:#A9D4F0; --sun:#FFCB47; --sun-dark:#E8A317; --coral:#E85D5D; --white:#FFFFFF; --shadow: 0 6px 0 rgba(14,48,80,0.18); }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{font-family:'Noto Nastaliq Urdu', serif; background: radial-gradient(circle at 15% 10%, rgba(58,143,204,0.22), transparent 40%), radial-gradient(circle at 85% 90%, rgba(255,203,71,0.22), transparent 45%), var(--sand);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; color:var(--deep); overflow-x:hidden;}
  .app{width:100%; max-width:560px;}
  .header{text-align:center; margin-bottom:16px;}
  .title{font-weight:700; font-size:clamp(26px,6.5vw,36px); margin:0;} .title span{color:var(--leaf);}
  .subtitle{font-family:'Nunito',sans-serif; font-size:12px; font-weight:800; color:var(--jungle); opacity:0.8; letter-spacing:1px; margin-top:4px;}
  .card{background:var(--white); border-radius:26px; padding:24px; border:3px solid var(--deep); box-shadow:var(--shadow); min-height:380px; display:flex; flex-direction:column;}
  .map-grid{display:flex; flex-direction:column; gap:10px;}
  .mission-row{display:flex; align-items:center; gap:14px; background:var(--sand); border:3px solid var(--deep); border-radius:18px; padding:12px 14px; cursor:pointer;}
  .mission-row.locked{opacity:0.55; cursor:not-allowed;} .mission-row:not(.locked):active{transform:scale(0.98);}
  .mission-num{font-family:'Nunito',sans-serif; font-weight:800; font-size:18px; width:40px; height:40px; border-radius:50%; background:var(--leaf); color:white; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .mission-row.locked .mission-num{background:#B0B0B0;} .mission-row.done .mission-num{background:var(--sun-dark);}
  .mission-info{flex:1;} .mission-title{font-weight:700; font-size:16px;}
  .mission-diff{font-family:'Nunito',sans-serif; font-size:11px; font-weight:800; color:var(--jungle); opacity:0.75;}
  .mission-badge{font-size:26px;} .stars-row{font-size:13px; margin-top:2px;}
  .stop-label{font-family:'Nunito',sans-serif; font-size:12px; font-weight:800; color:white; background:var(--jungle); display:inline-block; padding:5px 14px; border-radius:20px; align-self:flex-start; margin-bottom:14px;}
  .progress-dots{display:flex; gap:5px; margin-bottom:16px; flex-wrap:wrap;}
  .dot{width:10px; height:10px; border-radius:50%; background:var(--sand-dark); border:2px solid var(--deep);}
  .dot.filled{background:var(--leaf);} .dot.wrong{background:var(--coral);}
  .word-emoji{font-size:44px; text-align:center; margin-bottom:6px;}
  .question{font-size:clamp(22px,6.5vw,27px); font-weight:600; text-align:center; margin:6px 0 26px 0; line-height:1.9;}
  .blank{color:var(--coral); font-weight:700;}
  .options{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:auto;}
  .opt{font-family:'Noto Nastaliq Urdu',serif; font-weight:700; font-size:20px; padding:14px 6px; border-radius:16px; border:3px solid var(--deep); background:var(--sand); color:var(--deep); cursor:pointer; box-shadow:0 4px 0 var(--deep); transition:transform 0.08s, box-shadow 0.08s, background 0.2s;}
  .opt:active{transform:translateY(3px); box-shadow:0 1px 0 var(--deep);} .opt:disabled{cursor:default;}
  .opt.correct{background:var(--leaf); color:white; animation:pop 0.35s ease;}
  .opt.wrong{background:var(--coral); color:white; animation:shake 0.35s ease;} .opt.dim{opacity:0.45;}
  @keyframes pop{0%{transform:scale(1);} 40%{transform:scale(1.08);} 100%{transform:scale(1);}}
  @keyframes shake{0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);}}
  .feedback{text-align:center; font-family:'Noto Nastaliq Urdu',serif; font-weight:600; font-size:17px; height:26px; margin-top:14px; color:var(--jungle);}
  .end{text-align:center; padding:14px 0; margin:auto;}
  .end-emoji{font-size:64px; margin-bottom:10px;} .end-title{font-size:28px; font-weight:700; margin:0 0 6px 0;}
  .end-sub{font-family:'Nunito',sans-serif; font-size:14px; color:var(--jungle); margin-bottom:18px; font-weight:700;}
  .stars-big{font-size:30px; margin-bottom:14px;}
  .btn-primary{font-family:'Noto Nastaliq Urdu',serif; font-weight:700; font-size:19px; background:var(--sun); color:var(--deep); border:3px solid var(--deep); padding:12px 26px; border-radius:18px; cursor:pointer; box-shadow:0 5px 0 var(--sun-dark); margin:4px;}
  .btn-primary:active{transform:translateY(4px); box-shadow:0 1px 0 var(--sun-dark);}
  .btn-secondary{font-family:'Noto Nastaliq Urdu',serif; font-weight:700; font-size:18px; background:var(--white); color:var(--deep); border:3px solid var(--deep); padding:11px 22px; border-radius:18px; cursor:pointer; margin:4px;}
  .badge-shelf{display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:14px 0;} .badge-shelf span{font-size:22px;}
  .confetti{position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:hidden; z-index:50;}
  .confetti span{position:absolute; top:-20px; font-size:20px; animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg); opacity:0.9;}}
  footer{text-align:center; margin-top:14px; font-family:'Noto Nastaliq Urdu',serif; font-size:15px; color:var(--jungle); opacity:0.7; font-weight:600;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:0.001s !important; transition-duration:0.001s !important;}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1 class="title">حروفِ <span>جار</span> مہم 🧭</h1>
    <div class="subtitle">10 مشن &middot; صحیح حرفِ جار چنیں</div>
  </div>
  <div class="card" id="gameCard"></div>
  <footer>جملے میں خالی جگہ کے لیے صحیح لفظ چنیں 🍁</footer>
</div>

<script>
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function pickRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

const ALL_HAROOF = ['میں','پر','سے','کو','تک','کے پاس','کے ساتھ','کے لیے','کے بغیر'];

const sets = {
  'میں': ["پانی گلاس ___ ہے۔","کتابیں بستے ___ ہیں۔","کپڑے الماری ___ ہیں۔","پیسے جیب ___ ہیں۔","کھلونے ڈبے ___ ہیں۔","مچھلیاں تالاب ___ ہیں۔","پرندے پنجرے ___ ہیں۔","پھول گلدان ___ ہیں۔","دودھ گلاس ___ ہے۔","بچے کمرے ___ ہیں۔"],
  'پر': ["کتاب میز ___ ہے۔","بلی چھت ___ ہے۔","تصویر دیوار ___ ہے۔","برتن چولہے ___ ہیں۔","پرندہ درخت ___ ہے۔","جوتے قالین ___ ہیں۔","گھڑی میز ___ ہے۔","کپڑے بستر ___ ہیں۔","پھول درخت ___ ہیں۔","بادل آسمان ___ ہیں۔"],
  'سے': ["میں اسکول ___ آیا۔","وہ بازار ___ سیب لایا۔","بچے پارک ___ واپس آئے۔","پانی نل ___ آتا ہے۔","روشنی سورج ___ آتی ہے۔","وہ قلم ___ لکھتا ہے۔","ہم گھر ___ نکلے۔","آواز دور ___ آ رہی تھی۔","وہ ٹرین ___ آیا۔","خط ڈاکیے ___ ملا۔"],
  'کو': ["ماں بچے ___ کھانا دیتی ہے۔","استاد طالب علم ___ سبق پڑھاتا ہے۔","میں نے دوست ___ فون کیا۔","باپ بیٹے ___ کتاب دیتا ہے۔","وہ بلی ___ دودھ دیتی ہے۔","میں نے چڑیا ___ دانہ ڈالا۔","بہن بھائی ___ کھلونا دیتی ہے۔","ہم نے مہمان ___ چائے دی۔","اس نے غریب ___ پیسے دیے۔","میں نے دادا ___ خط لکھا۔"],
  'تک': ["وہ اسکول ___ پیدل گیا۔","ہم شام ___ کھیلتے رہے۔","بارش رات ___ ہوتی رہی۔","وہ گاؤں ___ سفر کرتا رہا۔","بچے چھٹی ___ انتظار کرتے رہے۔","وہ منزل ___ پہنچ گیا۔","کام صبح ___ مکمل ہوا۔","وہ اسٹیشن ___ دوڑا۔","سبق آخر ___ یاد کیا۔","وہ سمندر ___ چلتا رہا۔"],
  'کے پاس': ["میرے ___ ایک کتاب ہے۔","اس ___ نئی سائیکل ہے۔","ہمارے ___ وقت کم ہے۔","اس کے ___ بہت پیسے ہیں۔","تمہارے ___ کیا ہے؟","ان ___ ایک بڑا گھر ہے۔","میرے ___ دو دوست ہیں۔","اس ___ اچھی آواز ہے۔","ہمارے ___ اچھا استاد ہے۔","اس کے ___ ایک کتا ہے۔"],
  'کے ساتھ': ["میں اپنے دوست ___ کھیلا۔","وہ اپنی بہن ___ اسکول گیا۔","بچے استاد ___ باغ گئے۔","میں نے چائے دودھ ___ پی۔","وہ اپنے والد ___ بازار گیا۔","ہم اپنے مہمانوں ___ بیٹھے۔","بلی بلونگڑے ___ سوئی۔","وہ اپنی ماں ___ روتا رہا۔","میں نے کھانا نمک ___ کھایا۔","بچے اپنے دوستوں ___ ہنسے۔"],
  'کے لیے': ["یہ تحفہ آپ ___ ہے۔","ماں نے بچے ___ کھانا بنایا۔","یہ کتاب طالب علموں ___ ہے۔","باپ نے بیٹے ___ سائیکل خریدی۔","یہ دوا مریض ___ ہے۔","استاد نے بچوں ___ کہانی سنائی۔","یہ خط تمہارے ___ ہے۔","اس نے سب ___ چائے بنائی۔","یہ کھلونا چھوٹے بھائی ___ ہے۔","یہ پیغام سب ___ اہم ہے۔"],
  'کے بغیر': ["پانی ___ زندگی ممکن نہیں۔","نیند ___ صحت اچھی نہیں رہتی۔","محنت ___ کامیابی نہیں ملتی۔","ہوا ___ سانس لینا مشکل ہے۔","روشنی ___ کمرہ اندھیرا ہے۔","اجازت ___ اندر مت آؤ۔","مدد ___ یہ کام مشکل ہے۔","کوشش ___ کچھ حاصل نہیں ہوتا۔","پیار ___ گھر ادھورا ہے۔","علم ___ زندگی نامکمل ہے۔"]
};
const flatPool = [];
Object.keys(sets).forEach(k => sets[k].forEach(s => flatPool.push({sentence:s, correct:k})));

function genQ(correctWord){
  const s = pickRandom(sets[correctWord]);
  const decoys = shuffle(ALL_HAROOF.filter(w=>w!==correctWord)).slice(0,3);
  return { sentence:s.replace('___','<span class="blank">___</span>'), correct:correctWord, opts: shuffle([correctWord, ...decoys]) };
}
function genQMixed(){
  const item = pickRandom(flatPool);
  const decoys = shuffle(ALL_HAROOF.filter(w=>w!==item.correct)).slice(0,3);
  return { sentence:item.sentence.replace('___','<span class="blank">___</span>'), correct:item.correct, opts: shuffle([item.correct, ...decoys]) };
}
function genFrom(mission){
  const qs=[]; const seen=new Set(); let guard=0;
  while(qs.length<10 && guard<300){
    guard++;
    const q = mission.word==='mixed' ? genQMixed() : genQ(mission.word);
    if(seen.has(q.sentence)) continue; seen.add(q.sentence); qs.push(q);
  }
  return qs;
}
const missions = [
  {title:"میں", diff:"آسان", badge:"🥉", emoji:"🌼", word:'میں'},
  {title:"پر", diff:"آسان", badge:"🥉", emoji:"🍃", word:'پر'},
  {title:"سے", diff:"درمیانہ", badge:"🥈", emoji:"🌸", word:'سے'},
  {title:"کو", diff:"درمیانہ", badge:"🥈", emoji:"🌷", word:'کو'},
  {title:"تک", diff:"درمیانہ", badge:"🥈", emoji:"🦋", word:'تک'},
  {title:"کے پاس", diff:"مشکل", badge:"🥇", emoji:"🐘", word:'کے پاس'},
  {title:"کے ساتھ", diff:"مشکل", badge:"🥇", emoji:"🐒", word:'کے ساتھ'},
  {title:"کے لیے", diff:"مشکل", badge:"🥇", emoji:"🦁", word:'کے لیے'},
  {title:"کے بغیر", diff:"بہت مشکل", badge:"💎", emoji:"🐆", word:'کے بغیر'},
  {title:"چوٹی کا مقام", diff:"ماہر", badge:"👑", emoji:"🏔️", word:'mixed'}
];
let progress = missions.map(()=>({unlocked:false, done:false, stars:0})); progress[0].unlocked=true;
let session=null; const card=document.getElementById('gameCard');
function renderMap(){
  const doneCount=progress.filter(p=>p.done).length; let html=`<div class="map-grid">`;
  missions.forEach((m,i)=>{ const p=progress[i]; const cls=p.done?'done':(p.unlocked?'':'locked');
    const icon=p.done?m.badge:(p.unlocked?m.emoji:'🔒'); const stars=p.done?'⭐'.repeat(p.stars)+'☆'.repeat(3-p.stars):'';
    html += `<div class="mission-row ${cls}" onclick="${p.unlocked?`startMission(${i})`:''}">
      <div class="mission-num">${i+1}</div><div class="mission-info"><div class="mission-title">${m.title}</div><div class="mission-diff">${m.diff}</div>${stars?`<div class="stars-row">${stars}</div>`:''}</div>
      <div class="mission-badge">${icon}</div></div>`; });
  html += `</div>`;
  if(doneCount===missions.length) html += `<button class="btn-primary" style="margin-top:16px;" onclick="renderTrophy()">اپنی بڑی ٹرافی دیکھیں 🏆</button>`;
  card.innerHTML = html;
}
function startMission(i){ session={missionIdx:i, qIdx:0, correctCount:0, wrongDots:[], questions:genFrom(missions[i])}; renderQuestion(); }
function renderQuestion(){
  const m=missions[session.missionIdx];
  if(session.qIdx>=session.questions.length){ renderMissionComplete(); return; }
  const q=session.questions[session.qIdx]; let dots='';
  for(let i=0;i<session.questions.length;i++){ let cls='dot'; if(i<session.qIdx) cls += session.wrongDots[i]?' wrong':' filled'; dots+=`<div class="${cls}"></div>`; }
  card.innerHTML = `<div class="stop-label">مشن ${session.missionIdx+1}: ${m.title} — ${session.qIdx+1}/${session.questions.length}</div>
    <div class="progress-dots">${dots}</div><div class="word-emoji">${m.emoji}</div>
    <div class="question">${q.sentence}</div><div class="options" id="optionsWrap"></div><div class="feedback" id="feedback"></div>`;
  const wrap=document.getElementById('optionsWrap');
  q.opts.forEach(opt=>{ const btn=document.createElement('button'); btn.className='opt'; btn.textContent=opt; btn.onclick=()=>handleAnswer(opt,q.correct,btn); wrap.appendChild(btn); });
}
function handleAnswer(selected, correct, btnEl){
  const buttons=document.querySelectorAll('.opt'); if(buttons[0].disabled) return;
  const feedback=document.getElementById('feedback'); const isCorrect = selected===correct;
  buttons.forEach(b=>{ b.disabled=true; if(b.textContent===correct) b.classList.add('correct'); else if(b===btnEl) b.classList.add('wrong'); else b.classList.add('dim'); });
  if(isCorrect){ session.correctCount++; session.wrongDots[session.qIdx]=false; feedback.textContent=pickRandom(["شاباش! 🎉","بہت خوب! 🌟","بالکل ٹھیک! 🍃","زبردست! 🦋"]); feedback.style.color="#175A8C"; burstConfetti(); }
  else { session.wrongDots[session.qIdx]=true; feedback.textContent=`صحیح جواب: ${correct}`; feedback.style.color="#E85D5D"; }
  setTimeout(()=>{ session.qIdx++; renderQuestion(); }, 1200);
}
function renderMissionComplete(){
  const i=session.missionIdx; const m=missions[i]; const score=session.correctCount;
  let stars=score>=9?3:score>=6?2:1; progress[i].done=true; progress[i].stars=Math.max(progress[i].stars,stars);
  if(i+1<missions.length) progress[i+1].unlocked=true;
  card.innerHTML = `<div class="end"><div class="end-emoji">${m.badge}</div><div class="end-title">${m.title} مکمل!</div>
    <div class="end-sub">${score} میں سے ${session.questions.length} جواب درست</div>
    <div class="stars-big">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    <div><button class="btn-primary" onclick="renderMap()">نقشے پر واپس جائیں</button>
    ${i+1<missions.length?`<button class="btn-secondary" onclick="startMission(${i+1})">اگلا مشن ←</button>`:''}</div></div>`;
  bigConfetti();
}
function renderTrophy(){
  const badgeList=missions.map(m=>m.badge).join(' ');
  card.innerHTML = `<div class="end"><div class="end-emoji">🏆</div><div class="end-title">آپ ماہر بن گئے!</div>
    <div class="end-sub">آپ نے حروفِ جار مہم کے تمام 10 مشن مکمل کر لیے</div>
    <div class="badge-shelf"><span>${badgeList}</span></div>
    <button class="btn-primary" onclick="resetAll()">دوبارہ کھیلیں 🔁</button></div>`;
  bigConfetti();
}
function resetAll(){ progress = missions.map(()=>({unlocked:false, done:false, stars:0})); progress[0].unlocked=true; renderMap(); }
function burstConfetti(){ const layer=document.createElement('div'); layer.className='confetti'; const emojis=['🎉','⭐','🍃','🦋'];
  for(let i=0;i<10;i++){ const s=document.createElement('span'); s.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left=(40+Math.random()*20)+"%"; s.style.animationDuration=(1+Math.random()*0.6)+"s"; s.style.fontSize=(14+Math.random()*10)+"px"; layer.appendChild(s); }
  document.body.appendChild(layer); setTimeout(()=>layer.remove(),1600); }
function bigConfetti(){ const layer=document.createElement('div'); layer.className='confetti'; const emojis=['🎉','⭐','🍃','🦋','🏆','🌟'];
  for(let i=0;i<28;i++){ const s=document.createElement('span'); s.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left=Math.random()*100+"%"; s.style.animationDuration=(1.4+Math.random()*1.2)+"s"; s.style.fontSize=(14+Math.random()*14)+"px"; layer.appendChild(s); }
  document.body.appendChild(layer); setTimeout(()=>layer.remove(),2800); }
renderMap();
</script>
</body>
</html>
