<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spelling Safari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sand:#FFF8E7; --sand-dark:#FCEFCB;
    --jungle-deep:#1B4332; --jungle:#2D6A4F;
    --leaf:#52B788; --leaf-light:#95D5B2;
    --sun:#FFD60A; --sun-dark:#F4A100;
    --coral:#FF6B6B; --white:#FFFFFF;
    --gold:#FFD700; --silver:#C0C0C0; --bronze:#CD7F32; --diamond:#7FDBFF; --crown:#FF8C42;
    --shadow: 0 6px 0 rgba(27,67,50,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Nunito', sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(82,183,144,0.25), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(255,214,10,0.25), transparent 45%),
      var(--sand);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:20px; color:var(--jungle-deep); overflow-x:hidden;
  }
  .app{width:100%; max-width:560px;}
  .header{text-align:center; margin-bottom:16px;}
  .title{font-family:'Fredoka', sans-serif; font-weight:700; font-size:clamp(26px,7vw,36px); margin:0;}
  .title span{color:var(--leaf);}
  .subtitle{font-size:13px; font-weight:700; color:var(--jungle); opacity:0.75; text-transform:uppercase; letter-spacing:1.5px; margin-top:4px;}

  .card{
    background:var(--white); border-radius:26px; padding:24px; border:3px solid var(--jungle-deep);
    box-shadow:var(--shadow); min-height:380px; display:flex; flex-direction:column;
  }

  /* ---- Mission map ---- */
  .map-grid{display:flex; flex-direction:column; gap:10px;}
  .mission-row{
    display:flex; align-items:center; gap:14px;
    background:var(--sand); border:3px solid var(--jungle-deep); border-radius:18px;
    padding:12px 14px; cursor:pointer; transition:transform 0.1s;
  }
  .mission-row.locked{opacity:0.55; cursor:not-allowed;}
  .mission-row:not(.locked):active{transform:scale(0.98);}
  .mission-num{
    font-family:'Fredoka',sans-serif; font-weight:700; font-size:18px;
    width:40px; height:40px; border-radius:50%; background:var(--leaf); color:white;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .mission-row.locked .mission-num{background:#B0B0B0;}
  .mission-row.done .mission-num{background:var(--sun-dark);}
  .mission-info{flex:1;}
  .mission-title{font-family:'Fredoka',sans-serif; font-weight:600; font-size:15px;}
  .mission-diff{font-size:11px; font-weight:700; color:var(--jungle); opacity:0.7; text-transform:uppercase;}
  .mission-badge{font-size:26px;}
  .stars-row{font-size:13px; margin-top:2px;}

  /* ---- Quiz ---- */
  .stop-label{
    font-family:'Fredoka',sans-serif; font-size:12px; font-weight:600; color:white;
    background:var(--jungle); display:inline-block; padding:5px 14px; border-radius:20px;
    align-self:flex-start; margin-bottom:14px;
  }
  .progress-dots{display:flex; gap:5px; margin-bottom:16px; flex-wrap:wrap;}
  .dot{width:10px; height:10px; border-radius:50%; background:var(--sand-dark); border:2px solid var(--jungle-deep);}
  .dot.filled{background:var(--leaf);}
  .dot.wrong{background:var(--coral);}
  .word-emoji{font-size:44px; text-align:center; margin-bottom:6px;}
  .question{font-family:'Fredoka',sans-serif; font-size:clamp(18px,5vw,22px); font-weight:600; text-align:center; margin:6px 0 22px 0; line-height:1.35;}
  .options{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:auto;}
  .opt{
    font-family:'Nunito',sans-serif; font-weight:800; font-size:16px; padding:16px 8px; border-radius:16px;
    border:3px solid var(--jungle-deep); background:var(--sand); color:var(--jungle-deep); cursor:pointer;
    box-shadow:0 4px 0 var(--jungle-deep); transition:transform 0.08s, box-shadow 0.08s, background 0.2s;
    -webkit-tap-highlight-color:transparent; word-break:break-word;
  }
  .opt:active{transform:translateY(3px); box-shadow:0 1px 0 var(--jungle-deep);}
  .opt:disabled{cursor:default;}
  .opt.correct{background:var(--leaf); color:white; animation:pop 0.35s ease;}
  .opt.wrong{background:var(--coral); color:white; animation:shake 0.35s ease;}
  .opt.dim{opacity:0.45;}
  @keyframes pop{0%{transform:scale(1);} 40%{transform:scale(1.08);} 100%{transform:scale(1);}}
  @keyframes shake{0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);}}
  .feedback{text-align:center; font-family:'Fredoka',sans-serif; font-weight:600; font-size:15px; height:22px; margin-top:14px; color:var(--jungle);}

  /* ---- Mission complete / trophy ---- */
  .end{text-align:center; padding:14px 0; margin:auto;}
  .end-emoji{font-size:64px; margin-bottom:10px;}
  .end-title{font-family:'Fredoka',sans-serif; font-size:24px; font-weight:700; margin:0 0 6px 0;}
  .end-sub{font-size:14px; color:var(--jungle); margin-bottom:18px; font-weight:700;}
  .stars-big{font-size:30px; margin-bottom:14px;}
  .btn-primary{
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:16px; background:var(--sun); color:var(--jungle-deep);
    border:3px solid var(--jungle-deep); padding:13px 26px; border-radius:18px; cursor:pointer;
    box-shadow:0 5px 0 var(--sun-dark); transition:transform 0.08s, box-shadow 0.08s; margin:4px;
  }
  .btn-primary:active{transform:translateY(4px); box-shadow:0 1px 0 var(--sun-dark);}
  .btn-secondary{
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:15px; background:var(--white); color:var(--jungle-deep);
    border:3px solid var(--jungle-deep); padding:12px 22px; border-radius:18px; cursor:pointer; margin:4px;
  }
  .badge-shelf{display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:14px 0;}
  .badge-shelf span{font-size:22px;}

  .confetti{position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:hidden; z-index:50;}
  .confetti span{position:absolute; top:-20px; font-size:20px; animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg); opacity:0.9;}}

  footer{text-align:center; margin-top:14px; font-size:12px; color:var(--jungle); opacity:0.6; font-weight:700;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:0.001s !important; transition-duration:0.001s !important;}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1 class="title">Spelling <span>Safari</span> 🐒</h1>
    <div class="subtitle">10 missions &middot; 10 words each &middot; earn every badge</div>
  </div>
  <div class="card" id="gameCard"></div>
  <footer>Tap the correctly spelled word to move forward 🐾</footer>
</div>

<script>
/* ---------------- Mission Data ---------------- */
const missions = [
  { title:"Base Camp", diff:"Easy", badge:"🥉", emoji:"🏕️", words:["cat","dog","sun","run","big","red","box","hop","top","sit"] },
  { title:"Riverbank Trail", diff:"Easy", badge:"🥉", emoji:"🏞️", words:["jump","happy","apple","table","chair","water","house","mother","father","brother"] },
  { title:"Grasslands", diff:"Easy-Medium", badge:"🥈", emoji:"🌾", words:["friend","banana","elephant","garden","yellow","purple","animal","flower","forest","river"] },
  { title:"Jungle Canopy", diff:"Medium", badge:"🥈", emoji:"🌳", words:["monkey","tiger","rabbit","turtle","giraffe","crocodile","butterfly","mountain","thunder","whisper"] },
  { title:"Hidden Cave", diff:"Medium", badge:"🥈", emoji:"🕳️", words:["because","believe","different","favorite","together","remember","sentence","beautiful","adventure","dangerous"] },
  { title:"Rocky Cliffs", diff:"Medium-Hard", badge:"🥇", emoji:"⛰️", words:["necessary","separate","definitely","government","immediately","restaurant","particular","vegetable","temperature","chocolate"] },
  { title:"Misty Mountains", diff:"Hard", badge:"🥇", emoji:"🌫️", words:["rhythm","mysterious","embarrass","occurred","achievement","guarantee","knowledge","environment","independent","recommend"] },
  { title:"Ancient Ruins", diff:"Hard", badge:"🥇", emoji:"🏛️", words:["conscience","questionnaire","maintenance","privilege","receive","ridiculous","surprise","tomorrow","vacuum","weird"] },
  { title:"Dragon's Pass", diff:"Very Hard", badge:"💎", emoji:"🐉", words:["bureaucracy","entrepreneur","pronunciation","Wednesday","February","calendar","jewelry","license","mediocre","millennium"] },
  { title:"Summit of Safari", diff:"Expert", badge:"👑", emoji:"🏔️", words:["conscientious","unnecessary","miscellaneous","playwright","silhouette","camouflage","questionable","subtlety","acquaintance","gauge"] }
];

/* ---------------- Decoy generator ---------------- */
function transpose(w){
  if(w.length<3) return null;
  const i = 1 + Math.floor(Math.random()*(w.length-2));
  const a = w.split('');
  [a[i],a[i+1]] = [a[i+1],a[i]];
  return a.join('');
}
function doubleLetter(w){
  const i = Math.floor(Math.random()*w.length);
  return w.slice(0,i+1) + w[i] + w.slice(i+1);
}
function dropLetter(w){
  if(w.length<4) return null;
  const i = Math.floor(Math.random()*w.length);
  return w.slice(0,i) + w.slice(i+1);
}
function vowelSwap(w){
  const vowels = 'aeiou';
  const idxs = [...w].map((c,i)=> vowels.includes(c.toLowerCase()) ? i : -1).filter(i=>i>=0);
  if(!idxs.length) return null;
  const i = idxs[Math.floor(Math.random()*idxs.length)];
  const cur = w[i].toLowerCase();
  const opts = vowels.split('').filter(v=>v!==cur);
  const rep = opts[Math.floor(Math.random()*opts.length)];
  return w.slice(0,i) + rep + w.slice(i+1);
}
function generateDecoys(word){
  const lower = word.toLowerCase();
  const isCap = word[0] === word[0].toUpperCase() && word[0] !== word[0].toLowerCase();
  const mutators = [transpose, doubleLetter, dropLetter, vowelSwap, transpose, doubleLetter];
  const decoys = new Set();
  let attempts = 0;
  while(decoys.size < 3 && attempts < 60){
    attempts++;
    const fn = mutators[Math.floor(Math.random()*mutators.length)];
    let result = fn(lower);
    if(!result || result === lower) continue;
    if(isCap) result = result[0].toUpperCase() + result.slice(1);
    decoys.add(result);
  }
  return Array.from(decoys).slice(0,3);
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* ---------------- State ---------------- */
let progress = missions.map(()=>({unlocked:false, done:false, stars:0}));
progress[0].unlocked = true;
let session = null; // {missionIdx, qIdx, correctCount, results:[]}

const card = document.getElementById('gameCard');

function renderMap(){
  const doneCount = progress.filter(p=>p.done).length;
  let html = `<div class="map-grid">`;
  missions.forEach((m,i)=>{
    const p = progress[i];
    const cls = p.done ? 'done' : (p.unlocked ? '' : 'locked');
    const icon = p.done ? m.badge : (p.unlocked ? m.emoji : '🔒');
    const stars = p.done ? '⭐'.repeat(p.stars) + '☆'.repeat(3-p.stars) : '';
    html += `
      <div class="mission-row ${cls}" onclick="${p.unlocked ? `startMission(${i})` : ''}">
        <div class="mission-num">${i+1}</div>
        <div class="mission-info">
          <div class="mission-title">${m.title}</div>
          <div class="mission-diff">${m.diff}</div>
          ${stars ? `<div class="stars-row">${stars}</div>` : ''}
        </div>
        <div class="mission-badge">${icon}</div>
      </div>`;
  });
  html += `</div>`;
  if(doneCount === missions.length){
    html += `<button class="btn-primary" style="margin-top:16px;" onclick="renderTrophy()">See Your Grand Trophy 🏆</button>`;
  }
  card.innerHTML = html;
}

function startMission(i){
  const m = missions[i];
  const questions = m.words.map(word => {
    const opts = shuffle([word, ...generateDecoys(word)]);
    return { word, opts };
  });
  session = { missionIdx:i, qIdx:0, correctCount:0, wrongDots:[] };
  session.questions = shuffle(questions);
  renderQuestion();
}

function renderQuestion(){
  const m = missions[session.missionIdx];
  if(session.qIdx >= session.questions.length){
    renderMissionComplete();
    return;
  }
  const q = session.questions[session.qIdx];
  let dots = '';
  for(let i=0;i<session.questions.length;i++){
    let cls = 'dot';
    if(i < session.qIdx) cls += session.wrongDots[i] ? ' wrong' : ' filled';
    dots += `<div class="${cls}"></div>`;
  }
  card.innerHTML = `
    <div class="stop-label">MISSION ${session.missionIdx+1}: ${m.title.toUpperCase()} — WORD ${session.qIdx+1}/${session.questions.length}</div>
    <div class="progress-dots">${dots}</div>
    <div class="word-emoji">${m.emoji}</div>
    <div class="question">Which word is spelled correctly?</div>
    <div class="options" id="optionsWrap"></div>
    <div class="feedback" id="feedback"></div>
  `;
  const wrap = document.getElementById('optionsWrap');
  q.opts.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = opt;
    btn.onclick = () => handleAnswer(opt, q.word, btn);
    wrap.appendChild(btn);
  });
}

function handleAnswer(selected, correct, btnEl){
  const buttons = document.querySelectorAll('.opt');
  if(buttons[0].disabled) return;
  const feedback = document.getElementById('feedback');
  const isCorrect = selected === correct;

  buttons.forEach(b=>{
    b.disabled = true;
    if(b.textContent === correct) b.classList.add('correct');
    else if(b === btnEl) b.classList.add('wrong');
    else b.classList.add('dim');
  });

  if(isCorrect){
    session.correctCount++;
    session.wrongDots[session.qIdx] = false;
    feedback.textContent = pickPraise();
    feedback.style.color = "#2D6A4F";
    burstConfetti();
  } else {
    session.wrongDots[session.qIdx] = true;
    feedback.textContent = `Correct spelling: ${correct}`;
    feedback.style.color = "#FF6B6B";
  }

  setTimeout(()=>{
    session.qIdx++;
    renderQuestion();
  }, 1100);
}

function pickPraise(){
  const p = ["Great job! 🎉","Nice one! 🐒","You got it! 🌟","Awesome! 🦋","Correct! 🍃"];
  return p[Math.floor(Math.random()*p.length)];
}

function renderMissionComplete(){
  const i = session.missionIdx;
  const m = missions[i];
  const score = session.correctCount;
  let stars = score >= 9 ? 3 : score >= 6 ? 2 : 1;

  progress[i].done = true;
  progress[i].stars = Math.max(progress[i].stars, stars);
  if(i+1 < missions.length) progress[i+1].unlocked = true;

  card.innerHTML = `
    <div class="end">
      <div class="end-emoji">${m.badge}</div>
      <div class="end-title">${m.title} Complete!</div>
      <div class="end-sub">You spelled ${score} out of ${session.questions.length} words correctly</div>
      <div class="stars-big">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
      <div>
        <button class="btn-primary" onclick="renderMap()">Back to Safari Map</button>
        ${i+1 < missions.length ? `<button class="btn-secondary" onclick="startMission(${i+1})">Next Mission →</button>` : ''}
      </div>
    </div>
  `;
  bigConfetti();
}

function renderTrophy(){
  const badgeList = missions.map(m=>m.badge).join(' ');
  card.innerHTML = `
    <div class="end">
      <div class="end-emoji">🏆</div>
      <div class="end-title">Safari Champion!</div>
      <div class="end-sub">You completed all 10 missions of Spelling Safari</div>
      <div class="badge-shelf"><span>${badgeList}</span></div>
      <button class="btn-primary" onclick="resetAll()">Play Again From Start 🔁</button>
    </div>
  `;
  bigConfetti();
}

function resetAll(){
  progress = missions.map(()=>({unlocked:false, done:false, stars:0}));
  progress[0].unlocked = true;
  renderMap();
}

function burstConfetti(){
  const layer = document.createElement('div');
  layer.className = 'confetti';
  const emojis = ['🎉','⭐','🍃','🦋'];
  for(let i=0;i<10;i++){
    const s = document.createElement('span');
    s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left = (40 + Math.random()*20) + "%";
    s.style.animationDuration = (1 + Math.random()*0.6) + "s";
    s.style.fontSize = (14 + Math.random()*10) + "px";
    layer.appendChild(s);
  }
  document.body.appendChild(layer);
  setTimeout(()=>layer.remove(), 1600);
}
function bigConfetti(){
  const layer = document.createElement('div');
  layer.className = 'confetti';
  const emojis = ['🎉','⭐','🍃','🦋','🏆','🌟'];
  for(let i=0;i<28;i++){
    const s = document.createElement('span');
    s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left = Math.random()*100 + "%";
    s.style.animationDuration = (1.4 + Math.random()*1.2) + "s";
    s.style.fontSize = (14 + Math.random()*14) + "px";
    layer.appendChild(s);
  }
  document.body.appendChild(layer);
  setTimeout(()=>layer.remove(), 2800);
}

renderMap();
</script>
</body>
</html>
